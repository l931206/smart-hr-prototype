<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中控系統登入示範｜智慧人資管理平台</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    body { min-height: 100vh; background: #f4f7fb; }
    .portal { width: min(100% - 32px, 920px); margin: 0 auto; padding: 48px 0; }
    .portal-header { margin-bottom: 26px; text-align: center; }
    .portal-header .brand-mark { margin: 0 auto 14px; }
    .portal-header h1 { margin: 0; font-size: clamp(28px, 5vw, 42px); }
    .portal-header p { margin: 10px auto 0; max-width: 640px; color: var(--color-muted); line-height: 1.7; }
    .notice { margin-bottom: 22px; padding: 15px 18px; border: 1px solid #bfe5df; border-radius: 14px; color: #0f766e; background: #ecfdf9; }
    .role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .role-card { padding: 24px; border: 1px solid var(--color-border); border-radius: 22px; background: #fff; box-shadow: var(--shadow-medium); }
    .role-card h2 { margin: 16px 0 6px; font-size: 22px; }
    .role-card p { min-height: 48px; margin: 0 0 20px; color: var(--color-muted); line-height: 1.6; }
    .role-icon { display: grid; width: 52px; height: 52px; place-items: center; border-radius: 15px; color: #fff; background: var(--color-primary); font-size: 25px; }
    .role-card button { width: 100%; min-height: 46px; border-radius: 12px; color: #fff; background: var(--color-primary); font-weight: 800; }
    .role-card button:disabled { cursor: wait; opacity: .6; }
    .portal-footer { margin-top: 24px; text-align: center; }
    .portal-footer a { color: var(--color-primary); font-weight: 800; }
    .error { display: none; margin-top: 18px; padding: 13px 16px; border-radius: 12px; color: var(--color-danger); background: var(--color-danger-bg); }
    @media (max-width: 760px) { .portal { padding: 28px 0; } .role-grid { grid-template-columns: 1fr; } .role-card p { min-height: auto; } }
  </style>
</head>
<body>
  <main class="portal">
    <header class="portal-header">
      <div class="brand-mark">SSO</div>
      <h1>公司中控系統登入示範</h1>
      <p>此頁模擬未來公司的統一登入入口。選擇身分後，中控會發出短效 Token，人資系統驗證 Token 與權限後，自動進入對應工作台。</p>
    </header>

    <div class="notice">展示模式：Token 有效時間為 15 分鐘。正式串接時會改用公司中控提供的驗證服務。</div>

    <section class="role-grid" aria-label="選擇中控示範身分">
      <article class="role-card">
        <div class="role-icon">員</div>
        <h2>員工身分</h2>
        <p>可查看個人資料、提出請假與晚到通知。</p>
        <button type="button" data-external-id="central-employee-001">使用員工身分登入</button>
      </article>
      <article class="role-card">
        <div class="role-icon">主</div>
        <h2>主管身分</h2>
        <p>可查看團隊、審核請假與管理公告。</p>
        <button type="button" data-external-id="central-manager-001">使用主管身分登入</button>
      </article>
      <article class="role-card">
        <div class="role-icon">管</div>
        <h2>管理者身分</h2>
        <p>可管理員工、部門、帳號與系統設定。</p>
        <button type="button" data-external-id="central-admin-001">使用管理者身分登入</button>
      </article>
    </section>

    <div class="error" id="centralError" role="alert"></div>
    <div class="portal-footer"><a href="login.html">返回人資系統原登入頁</a></div>
  </main>

  <script src="assets/js/api.js?v=20260813-sso1"></script>
  <script>
    const rolePaths = { employee: "employee/index.html", manager: "manager/index.html", admin: "admin/index.html" };
    const errorBox = document.querySelector("#centralError");
    document.querySelectorAll("[data-external-id]").forEach((button) => {
      button.addEventListener("click", async () => {
        errorBox.style.display = "none";
        document.querySelectorAll("[data-external-id]").forEach((item) => { item.disabled = true; });
        try {
          const user = await centralLogin(button.dataset.externalId);
          window.location.href = rolePaths[user.role] || "index.html";
        } catch (error) {
          errorBox.textContent = error.message || "中控登入失敗，請稍後再試。";
          errorBox.style.display = "block";
          document.querySelectorAll("[data-external-id]").forEach((item) => { item.disabled = false; });
        }
      });
    });
  </script>
</body>
</html>
