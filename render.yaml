services:
  - type: web
    name: smart-hr-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py bootstrap_demo && python manage.py collectstatic --no-input
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: AUTH_MODE
        value: hybrid
      - key: ENABLE_MOCK_CENTRAL
        value: "1"
      - key: MOCK_CENTRAL_TOKEN_MAX_AGE
        value: "900"
      - key: DEMO_EMPLOYEE_USERNAME
        value: employee01
      - key: DEMO_EMPLOYEE_PASSWORD
        sync: false
      - key: DEMO_MANAGER_USERNAME
        value: manager01
      - key: DEMO_MANAGER_PASSWORD
        sync: false
      - key: DEMO_ADMIN_USERNAME
        value: admin01
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: CENTRAL_TOKEN_VERIFY_URL
        sync: false
      - key: CENTRAL_API_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: https://l931206.github.io
      - key: CSRF_TRUSTED_ORIGINS
        value: https://l931206.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: smart-hr-db
          property: connectionString

databases:
  - name: smart-hr-db
    plan: free
    region: oregon
