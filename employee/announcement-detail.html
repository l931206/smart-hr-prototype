<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>公告詳情｜智慧人資管理平台</title>

  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">

  <style>
    .announcement-detail-page {
      width: min(800px, calc(100% - 28px));
    }

    .announcement-detail-card {
      padding: 30px;
    }

    .announcement-detail-head {
      padding-bottom: 22px;
      border-bottom: 1px solid #edf1f5;
    }

    .announcement-detail-tag {
      display: inline-flex;
      padding: 6px 11px;
      border-radius: 999px;
      color: var(--color-success);
      background: var(--color-success-bg);
      font-size: 13px;
      font-weight: 800;
    }

    .announcement-detail-head h1 {
      margin: 16px 0 0;
      font-size: 30px;
      line-height: 1.35;
    }

    .announcement-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 14px;
      color: var(--color-muted);
      font-size: 14px;
    }

    .announcement-content {
      margin-top: 24px;
      color: var(--color-text-soft);
      line-height: 1.9;
    }

    .announcement-content h2 {
      margin: 26px 0 10px;
      color: var(--color-text);
      font-size: 20px;
    }

    .announcement-content p {
      margin: 0 0 16px;
    }

    .activity-info {
      margin-top: 20px;
      padding: 18px;
      border-left: 4px solid var(--color-primary);
      border-radius: 12px;
      background: #f0fdfa;
    }

    .activity-row {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 14px;
      padding: 10px 0;
    }

    .activity-row span {
      color: var(--color-muted);
      font-size: 14px;
    }

    .activity-row strong {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .attachment-box {
      margin-top: 22px;
      padding: 18px;
      border-radius: 14px;
      background: #f8fafc;
    }

    .attachment-box h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .attachment-file {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 13px;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      background: var(--color-surface);
    }

    .attachment-file strong {
      min-width: 0;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .attachment-file span {
      flex: 0 0 auto;
      color: var(--color-primary);
      font-size: 13px;
      font-weight: 800;
    }

    .announcement-detail-actions {
      margin-top: 26px;
    }

    @media (max-width: 700px) {
      .announcement-detail-page {
        width: calc(100% - 20px);
      }

      .announcement-detail-page .back {
        display: none;
      }

      .announcement-detail-card {
        padding: 18px;
      }

      .announcement-detail-head {
        padding-bottom: 16px;
      }

      .announcement-detail-head h1 {
        margin-top: 12px;
        font-size: 23px;
      }

      .announcement-meta {
        flex-direction: column;
        gap: 5px;
        margin-top: 11px;
        font-size: 12px;
      }

      .announcement-content {
        margin-top: 18px;
        font-size: 14px;
        line-height: 1.8;
      }

      .announcement-content h2 {
        margin-top: 22px;
        font-size: 18px;
      }

      .activity-info {
        padding: 15px;
      }

      .activity-row {
        grid-template-columns: 1fr;
        gap: 4px;
        padding: 9px 0;
      }

      .activity-row span {
        font-size: 12px;
      }

      .activity-row strong {
        font-size: 14px;
      }

      .attachment-box {
        padding: 15px;
      }

      .attachment-file {
        align-items: flex-start;
        flex-direction: column;
      }

      .announcement-detail-actions {
        margin-top: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="page announcement-detail-page">

    <a class="back" href="announcements.html">
      ← 返回公告中心
    </a>

    <article class="card announcement-detail-card">

      <header class="announcement-detail-head">
        <span class="announcement-detail-tag">
          公司公告
        </span>

        <h1>公告資料載入中…</h1>

        <div class="announcement-meta">
          <span>發布人：所屬部門</span>

          <time datetime="—">
            發布日期：—
          </time>

          <span>公告編號：—</span>
        </div>
      </header>

      <section class="announcement-content">
        <p>公告內容載入中…</p>
      </section>

      <section class="attachment-box">
        <h2>附件</h2>
        <p>目前沒有附件。</p>
      </section>

      <div class="actions announcement-detail-actions">
        <a
          class="button primary"
          href="announcements.html"
        >
          返回公告中心
        </a>

        <a
          class="button secondary"
          href="index.html"
        >
          返回員工首頁
        </a>
      </div>
    </article>
  </main>

  <nav
    class="mobile-nav"
    aria-label="員工手機導覽"
  >
    <a
      class="active"
      href="index.html"
    >
      <span>⌂</span>
      <small>首頁</small>
    </a>

    <a href="leave-apply.html">
      <span>＋</span>
      <small>請假</small>
    </a>

    <a href="notifications.html">
      <span>●</span>
      <small>通知</small>
    </a>

    <a href="profile.html">
      <span>人</span>
      <small>我的</small>
    </a>
  </nav>
  <script src="../assets/js/api.js?v=20260811-live47"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) return;
      try {
        const item = await apiRequest(`/announcements/${id}/`);
        document.querySelector(".announcement-detail-tag").textContent = item.category_label || "公告";
        document.querySelector(".announcement-detail-head h1").textContent = item.title;
        document.querySelector(".announcement-meta").textContent = `發布人：${item.author_name || "—"}｜${new Date(item.published_at || item.created_at).toLocaleString("zh-TW")}`;
        document.querySelector(".announcement-content > p").textContent = item.content;
        document.querySelectorAll(".activity-info, .announcement-content h2, .announcement-content p ~ h2").forEach((node) => node.remove());
        const attachment = document.querySelector(".attachment-box");
        if (attachment) {
          attachment.innerHTML = item.attachment_data ? `<h2>附件</h2><button class="attachment-file" type="button"><strong>${item.attachment_name}</strong><span>下載附件 →</span></button>` : "<h2>附件</h2><p>目前沒有附件。</p>";
          attachment.querySelector("button")?.addEventListener("click", () => downloadAttachment(item.attachment_name, item.attachment_data));
        }
        document.title = `${item.title} - 公告`;
      } catch (error) {
        document.querySelector(".announcement-content").innerHTML = `<p>無法載入公告：${error.message}</p>`;
      }
    })();
  </script>
</body>
</html>
