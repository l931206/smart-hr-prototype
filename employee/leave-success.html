<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>請假申請已送出｜智慧人資管理平台</title>

  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">

  <style>
    .success-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .success-card {
      width: min(560px, 100%);
      padding: 38px 30px;
      text-align: center;
    }

    .success-icon {
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      color: white;
      background: var(--color-primary);
      font-size: 38px;
      box-shadow: 0 14px 30px rgba(15, 118, 110, 0.24);
    }

    .success-card h1 {
      margin: 0;
      font-size: 30px;
    }

    .success-card > p {
      max-width: 430px;
      margin: 14px auto 0;
      color: var(--color-muted);
      line-height: 1.75;
    }

    .application-info {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #f0fdfa;
      text-align: left;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 9px 0;
    }

    .info-row span {
      color: var(--color-muted);
      font-size: 14px;
    }

    .info-row strong {
      color: var(--color-primary);
      text-align: right;
      overflow-wrap: anywhere;
    }

    .pending-status {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--color-warning);
      background: var(--color-warning-bg);
      font-size: 13px;
      font-weight: 800;
    }

    .success-notice {
      margin-top: 18px;
      text-align: left;
    }

    .success-actions {
      justify-content: center;
      margin-top: 28px;
    }

    @media (max-width: 700px) {
      .success-page {
        align-items: start;
        padding: 18px 10px 100px;
      }

      .success-card {
        margin-top: 18px;
        padding: 28px 20px;
        border-radius: 22px;
      }

      .success-icon {
        width: 72px;
        height: 72px;
        font-size: 32px;
      }

      .success-card h1 {
        font-size: 24px;
      }

      .success-card > p {
        font-size: 14px;
      }

      .application-info {
        padding: 15px;
      }

      .info-row {
        flex-direction: column;
        gap: 4px;
        padding: 8px 0;
      }

      .info-row span {
        font-size: 12px;
      }

      .info-row strong {
        text-align: left;
        font-size: 14px;
      }

      .success-notice {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="success-page">
    <main class="card success-card">

      <div class="success-icon">
        ✓
      </div>

      <h1>請假申請已送出</h1>

      <p>
        系統已將申請交給直屬主管審核。
        審核結果會顯示在通知中心與請假紀錄中。
      </p>

      <section class="application-info">
        <div class="info-row">
          <span>申請編號</span>
          <strong>—</strong>
        </div>

        <div class="info-row">
          <span>假別</span>
          <strong>特休假</strong>
        </div>

        <div class="info-row">
          <span>審核主管</span>
          <strong>—</strong>
        </div>

        <div class="info-row">
          <span>目前狀態</span>
          <strong class="pending-status">
            等待主管審核
          </strong>
        </div>
      </section>

      <div class="notice success-notice">
        你可以隨時前往「請假紀錄」查看進度；
        審核完成後，通知中心也會顯示最新結果。
      </div>

      <div class="actions success-actions">
        <a
          class="button primary"
          href="leave-history.html"
        >
          查看請假紀錄
        </a>

        <a
          class="button secondary"
          href="index.html"
        >
          返回員工首頁
        </a>
      </div>
    </main>
  </div>

  <nav
    class="mobile-nav"
    aria-label="員工手機導覽"
  >
    <a href="index.html">
      <span>⌂</span>
      <small>首頁</small>
    </a>

    <a
      class="active"
      href="leave-apply.html"
      aria-current="page"
    >
      <span>＋</span>
      <small>請假</small>
    </a>

    <a href="notifications.html">
      <span>●</span>
      <small>通知</small>
    </a>

    <a href="profile.html">
      <span>人</span>
      <small>我的</small>
    </a>
  </nav>
  <script src="../assets/js/api.js?v=20260811-live43"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(location.search).get("id");
      if (!id) return;
      try {
        const [item, user] = await Promise.all([apiRequest(`/leave-requests/${id}/`), getCurrentUser()]);
        const values = document.querySelectorAll(".application-info .info-row strong");
        if (values[0]) values[0].textContent = `LEAVE-${String(item.id).padStart(6, "0")}`;
        if (values[1]) values[1].textContent = item.leave_type;
        if (values[2]) values[2].textContent = user.manager_name || "尚未設定";
        if (values[3]) values[3].textContent = item.status_label;
      } catch (error) { document.querySelector(".application-info").innerHTML = `<p>無法載入申請資料：${error.message}</p>`; }
    })();
  </script>
</body>
</html>
