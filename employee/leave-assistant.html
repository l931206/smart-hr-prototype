<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>對話式請假｜智慧人資管理平台</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">
  <style>
    .assistant-page { width: min(880px, calc(100% - 28px)); }
    .assistant-header { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin:24px 0; }
    .assistant-header h1 { margin:0 0 8px; font-size:clamp(30px, 5vw, 44px); }
    .assistant-header p { margin:0; color:#667892; line-height:1.7; }
    .assistant-status { display:flex; align-items:center; gap:8px; color:#087f73; font-weight:800; white-space:nowrap; }
    .assistant-status::before { content:""; width:10px; height:10px; border-radius:50%; background:#19a974; box-shadow:0 0 0 5px #dff8ef; }
    .chat-shell { overflow:hidden; padding:0; }
    .chat-messages { min-height:430px; max-height:62vh; overflow-y:auto; padding:28px; background:linear-gradient(180deg,#f8fbff 0%,#f3f7fb 100%); }
    .message { display:flex; gap:10px; margin-bottom:18px; align-items:flex-start; }
    .message.user { justify-content:flex-end; }
    .message-avatar { display:grid; place-items:center; width:38px; height:38px; border-radius:12px; color:#fff; background:#11847b; font-weight:900; flex:0 0 auto; }
    .message-bubble { max-width:min(680px,82%); padding:14px 17px; border-radius:18px 18px 18px 5px; background:#fff; border:1px solid #dce6f0; box-shadow:0 6px 18px rgba(29,54,82,.06); line-height:1.65; }
    .message.user .message-bubble { color:#fff; background:#087f73; border-color:#087f73; border-radius:18px 18px 5px 18px; }
    .message-bubble p { margin:0; }
    .suggestions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .suggestion { border:1px solid #b9d7d3; border-radius:999px; padding:8px 12px; color:#087f73; background:#f4fffd; font:inherit; cursor:pointer; }
    .summary-card { margin-top:14px; padding:18px; border:1px solid #b7ddd8; border-radius:16px; background:#f5fffd; }
    .summary-card h2 { margin:0 0 12px; font-size:20px; }
    .chat-shell .summary-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 20px; margin:0; }
    .summary-item { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid #dcefeb; }
    .summary-item span { color:#64748b; }
    .summary-item strong { text-align:right; }
    .summary-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
    .assistant-success { padding:12px 14px; border-radius:12px; color:#087443; background:#dcf8e9; font-weight:800; }
    .chat-composer { padding:20px; border-top:1px solid #dce6f0; background:#fff; }
    .composer-row { display:flex; align-items:flex-end; gap:10px; }
    .composer-row textarea { flex:1 1 auto; width:auto; min-width:0; min-height:56px; max-height:150px; resize:vertical; margin:0; }
    .icon-button { width:52px; height:52px; border:1px solid #cad8e6; border-radius:14px; background:#fff; cursor:pointer; font-size:21px; flex:0 0 auto; }
    .icon-button.listening { color:#fff; border-color:#d94b57; background:#d94b57; animation:pulse 1.1s infinite; }
    .send-button { min-height:52px; white-space:nowrap; }
    .composer-meta { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-top:12px; color:#667892; font-size:14px; }
    .attachment-label { cursor:pointer; color:#087f73; font-weight:800; }
    .attachment-label input { position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none; clip-path:inset(50%); }
    .manual-link { color:#087f73; font-weight:800; }
    @keyframes pulse { 50% { transform:scale(1.06); } }
    @media (max-width:700px) {
      .assistant-page { width:min(100% - 20px,880px); padding-bottom:92px; }
      .assistant-header { display:block; margin:16px 0; }
      .assistant-status { margin-top:12px; }
      .chat-messages { min-height:52vh; padding:18px 14px; }
      .message-bubble { max-width:88%; }
      .chat-shell .summary-grid { grid-template-columns:1fr; }
      .composer-row { align-items:stretch; }
      .composer-row textarea { min-width:0; }
      .send-button { padding-inline:16px; }
      .composer-meta { align-items:flex-start; flex-direction:column; }
    }
  </style>
</head>
<body>
  <main class="page assistant-page">
    <a class="back" href="index.html">← 返回員工首頁</a>
    <header class="assistant-header">
      <div>
        <h1>對話式請假</h1>
        <p>直接說明假別、日期與原因，確認摘要後才會正式送出。</p>
      </div>
      <div class="assistant-status">請假服務已連線</div>
    </header>

    <section class="card chat-shell" aria-label="請假助理對話">
      <div class="chat-messages" id="chatMessages" role="log" aria-live="polite"></div>
      <form class="chat-composer" id="assistantForm">
        <div class="composer-row">
          <button class="icon-button" id="voiceButton" type="button" aria-label="使用語音輸入" title="使用語音輸入">🎤</button>
          <textarea id="assistantInput" required aria-label="請描述請假需求" placeholder="例如：我要請 9 月 3 日特休，原因是處理私人事務"></textarea>
          <button class="button primary send-button" type="submit">送出</button>
        </div>
        <div class="composer-meta">
          <label class="attachment-label">📎 加入附件<input id="assistantAttachment" type="file" accept=".pdf,.jpg,.jpeg,.png"></label>
          <span id="attachmentName">支援 PDF、JPG、PNG，最大 2 MB</span>
          <a class="manual-link" href="leave-apply.html">改用表單填寫 →</a>
        </div>
      </form>
    </section>
  </main>

  <nav class="mobile-nav" aria-label="員工手機導覽">
    <a href="index.html"><span>⌂</span><small>首頁</small></a>
    <a class="active" href="leave-assistant.html" aria-current="page"><span>＋</span><small>請假</small></a>
    <a href="notifications.html"><span>●</span><small>通知</small></a>
    <a href="profile.html"><span>人</span><small>我的</small></a>
  </nav>
  <script src="../assets/js/api.js?v=20260819-assistant1"></script>
  <script src="../assets/js/leave-assistant.js?v=20260819-assistant1"></script>
</body>
</html>
