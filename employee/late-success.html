<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>晚到通知已送出｜智慧人資管理平台</title>

  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">

  <style>
    .success-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .success-card {
      width: min(560px, 100%);
      padding: 38px 30px;
      text-align: center;
    }

    .success-icon {
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      color: white;
      background: var(--color-primary);
      font-size: 38px;
      box-shadow: 0 14px 30px rgba(15, 118, 110, 0.24);
    }

    .success-card h1 {
      margin: 0;
      font-size: 30px;
    }

    .success-card > p {
      max-width: 430px;
      margin: 14px auto 0;
      color: var(--color-muted);
      line-height: 1.75;
    }

    .notice-info {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #f0fdfa;
      text-align: left;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 9px 0;
    }

    .info-row span {
      color: var(--color-muted);
      font-size: 14px;
    }

    .info-row strong {
      color: var(--color-primary);
      text-align: right;
      overflow-wrap: anywhere;
    }

    .notified-status {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      color: #1d4ed8;
      background: #dbeafe;
      font-size: 13px;
      font-weight: 800;
    }

    .success-notice {
      margin-top: 18px;
      text-align: left;
    }

    .success-actions {
      justify-content: center;
      margin-top: 28px;
    }

    @media (max-width: 700px) {
      .success-page {
        align-items: start;
        padding: 18px 10px 100px;
      }

      .success-card {
        margin-top: 18px;
        padding: 28px 20px;
        border-radius: 22px;
      }

      .success-icon {
        width: 72px;
        height: 72px;
        font-size: 32px;
      }

      .success-card h1 {
        font-size: 24px;
      }

      .success-card > p {
        font-size: 14px;
      }

      .notice-info {
        padding: 15px;
      }

      .info-row {
        flex-direction: column;
        gap: 4px;
        padding: 8px 0;
      }

      .info-row span {
        font-size: 12px;
      }

      .info-row strong {
        text-align: left;
        font-size: 14px;
      }

      .success-notice {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="success-page">
    <main class="card success-card">

      <div class="success-icon">
        ✓
      </div>

      <h1>晚到通知已送出</h1>

      <p>
        系統已將通知傳送給直屬主管。
        到班後請依公司規定完成出勤紀錄。
      </p>

      <section class="notice-info">
        <div class="info-row">
          <span>通知編號</span>
          <strong id="lateNoticeId">—</strong>
        </div>

        <div class="info-row">
          <span>通知對象</span>
          <strong id="lateNoticeManager">—</strong>
        </div>

        <div class="info-row">
          <span>預計到班時間</span>
          <strong id="lateNoticeArrival">—</strong>
        </div>

        <div class="info-row">
          <span>目前狀態</span>
          <strong class="notified-status">
            已通知主管
          </strong>
        </div>
      </section>

      <div class="notice success-notice">
        晚到通知不會自動產生請假紀錄。
        若後續需要請假，仍須另外完成正式請假流程。
      </div>

      <div class="actions success-actions">
        <a
          class="button primary"
          href="index.html"
        >
          返回員工首頁
        </a>

        <a
          class="button secondary"
          href="late-notice.html"
        >
          重新填寫
        </a>
      </div>
    </main>
  </div>

  <nav
    class="mobile-nav"
    aria-label="員工手機導覽"
  >
    <a href="index.html">
      <span>⌂</span>
      <small>首頁</small>
    </a>

    <a href="leave-apply.html">
      <span>＋</span>
      <small>請假</small>
    </a>

    <a href="notifications.html">
      <span>●</span>
      <small>通知</small>
    </a>

    <a href="profile.html">
      <span>人</span>
      <small>我的</small>
    </a>
  </nav>
</body>
  <script src="../assets/js/api.js?v=20260811-live45"></script>
  <script>
    (async () => {
      const notice = JSON.parse(sessionStorage.getItem("hr_last_late_notice") || "null");
      if (!notice) return;
      const set = (id, value) => { const element = document.getElementById(id); if (element) element.textContent = value || "—"; };
      set("lateNoticeId", `LATE-${String(notice.id).padStart(6, "0")}`);
      set("lateNoticeArrival", notice.expected_arrival);
      try {
        const user = await getCurrentUser();
        const payload = await apiRequest("/employees/");
        const employees = Array.isArray(payload) ? payload : (payload.results || []);
        const manager = employees.find((item) => item.role === "manager" && item.department === user.department);
        set("lateNoticeManager", manager?.display_name || "尚未設定");
      } catch (error) { /* 成功頁仍可顯示已建立的通知編號 */ }
    })();
  </script>
</html>
