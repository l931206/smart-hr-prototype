<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>我的資料｜智慧人資管理平台</title>

  <!-- 全站共用樣式 -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">

  <style>
    /* 此頁專用樣式 */

    .profile-title {
      margin-bottom: 20px;
    }

    .profile-title h1 {
      margin: 0;
      font-size: 30px;
    }

    .profile-title p {
      margin: 7px 0 0;
      color: var(--color-muted);
    }

    .profile-hero {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 28px;
      border-radius: 26px;
      color: white;
      background:
        radial-gradient(
          circle at top right,
          rgba(255, 255, 255, 0.18),
          transparent 38%
        ),
        linear-gradient(
          135deg,
          var(--color-primary),
          #155e75
        );
      box-shadow: 0 20px 50px rgba(15, 118, 110, 0.2);
    }

    .profile-avatar {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 2px solid rgba(255, 255, 255, 0.28);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      font-size: 34px;
      font-weight: 800;
    }

    .profile-hero h2 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .profile-hero p {
      margin: 4px 0;
      opacity: 0.9;
    }

    .profile-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 7px 11px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 13px;
      font-weight: 800;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .profile-card h3 {
      margin: 0 0 18px;
      font-size: 21px;
    }

    .profile-card {
      align-items: stretch;
      text-align: left;
    }

    .profile-field {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid #edf1f5;
    }

    .profile-field:last-child {
      border-bottom: 0;
    }

    .profile-field > span {
      color: var(--color-muted);
      font-size: 14px;
    }

    .profile-field > strong {
      min-width: 0;
      font-size: 15px;
      line-height: 1.6;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .profile-notice {
      margin-top: 22px;
      border-left: 4px solid var(--color-primary);
      background: #f0fdfa;
    }

    .profile-actions {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    @media (max-width: 700px) {
      .profile-title {
        margin-bottom: 14px;
      }

      .profile-title h1 {
        font-size: 24px;
      }

      .profile-title p {
        font-size: 14px;
      }

      .profile-hero {
        align-items: flex-start;
        gap: 15px;
        padding: 20px;
        border-radius: 20px;
      }

      .profile-avatar {
        width: 64px;
        height: 64px;
        font-size: 25px;
      }

      .profile-hero h2 {
        font-size: 22px;
      }

      .profile-hero p {
        font-size: 13px;
      }

      .profile-status {
        margin-top: 9px;
        padding: 5px 9px;
        font-size: 12px;
      }

      .profile-grid {
        grid-template-columns: 1fr;
        gap: 12px;
        margin-top: 14px;
      }

      .profile-card {
        padding: 17px;
      }

      .profile-card h3 {
        margin-bottom: 10px;
        font-size: 18px;
      }

      .profile-field {
        grid-template-columns: 1fr;
        gap: 4px;
        padding: 11px 0;
      }

      .profile-field > span {
        font-size: 12px;
      }

      .profile-field > strong {
        font-size: 14px;
        text-align: left;
      }

      .profile-notice {
        margin-top: 14px;
        font-size: 14px;
      }

      .profile-actions {
        flex-direction: column;
        gap: 10px;
        margin-top: 14px;
      }

      .back {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- 電腦版返回按鈕 -->
    <a class="back" href="index.html">
      ← 返回員工首頁
    </a>

    <!-- 頁面標題 -->
    <header class="profile-title">
      <h1>我的資料</h1>
      <p>查看目前登記於公司系統中的員工資訊。</p>
    </header>

    <!-- 個人摘要 -->
    <section class="profile-hero">
      <div class="profile-avatar">
        <span id="profileAvatar">陳</span>
      </div>

      <div>
        <h2 id="profileName">陳員工</h2>
        <p>員工編號：<span id="profileEmployeeNo">EMP0003</span></p>
        <p><span id="profileDepartment">資訊部</span>｜軟體工程師</p>

        <span class="profile-status">
          ● 在職中
        </span>
      </div>
    </section>

    <!-- 詳細資料 -->
    <section class="profile-grid">

      <article class="card profile-card">
        <h3>基本資料</h3>

        <div class="profile-field">
          <span>姓名</span>
          <strong id="profileFullName">陳員工</strong>
        </div>

        <div class="profile-field">
          <span>電子郵件</span>
          <strong id="profileEmail">employee@example.com</strong>
        </div>

        <div class="profile-field">
          <span>聯絡電話</span>
          <strong id="profilePhone">—</strong>
        </div>

        <div class="profile-field">
          <span>在職狀態</span>
          <strong>
            <span id="profileEmploymentStatus" class="status active">
              在職
            </span>
          </strong>
        </div>
      </article>

      <article class="card profile-card">
        <h3>職務資訊</h3>

        <div class="profile-field">
          <span>所屬部門</span>
          <strong id="profileDepartmentDetail">資訊部</strong>
        </div>

        <div class="profile-field">
          <span>職稱</span>
          <strong>軟體工程師</strong>
        </div>

        <div class="profile-field">
          <span>直屬主管</span>
          <strong>王主管</strong>
        </div>

        <div class="profile-field">
          <span>到職日期</span>
          <strong id="profileHireDate">2026/01/01</strong>
        </div>
      </article>
    </section>

    <!-- 系統提示 -->
    <div class="notice profile-notice">
      員工只能查看個人資料。若資料有誤，可提出修改申請，
      由系統管理者審核後更新。
    </div>

    <!-- 操作按鈕 -->
    <div class="profile-actions">
      <a
        class="button primary"
        href="profile-edit.html"
      >
        申請修改資料
      </a>

      <a
        class="button secondary desktop-only"
        href="index.html"
      >
        返回工作台
      </a>
    </div>
  </main>

  <!-- 手機版底部導覽 -->
  <nav
    class="mobile-nav"
    aria-label="員工手機導覽"
  >
    <a href="index.html">
      <span>⌂</span>
      <small>首頁</small>
    </a>

    <a href="leave-apply.html">
      <span>＋</span>
      <small>請假</small>
    </a>

    <a href="notifications.html">
      <span>●</span>
      <small>通知</small>
    </a>

    <a
      class="active"
      href="profile.html"
      aria-current="page"
    >
      <span>人</span>
      <small>我的</small>
    </a>
  </nav>
  <script src="../assets/js/api.js"></script>
  <script>
    (async () => {
      try {
        const user = await getCurrentUser();
        const name = user.display_name || user.username;
        const department = user.department_name || "尚未分配部門";
        const hireDate = user.hire_date || "尚未設定";
        document.querySelector("#profileAvatar").textContent = name.slice(0, 1);
        document.querySelector("#profileName").textContent = name;
        document.querySelector("#profileEmployeeNo").textContent = user.employee_no || "—";
        document.querySelector("#profileDepartment").textContent = department;
        document.querySelector("#profileFullName").textContent = name;
        document.querySelector("#profileEmail").textContent = user.email || "尚未設定";
        document.querySelector("#profilePhone").textContent = user.phone || "尚未設定";
        document.querySelector("#profileDepartmentDetail").textContent = department;
        document.querySelector("#profileHireDate").textContent = hireDate;
      } catch (error) {
        window.location.href = "../login.html?next=employee/profile.html";
      }
    })();
  </script>
</body>
</html>
