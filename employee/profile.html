<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>我的資料｜智慧人資管理平台</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">
  <style>
    .profile-page{width:min(1040px,calc(100% - 32px));padding-bottom:38px}.profile-topbar{margin-bottom:20px}.profile-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16px}.profile-heading h1{margin:0;font-size:30px}.profile-heading p{margin:7px 0 0;color:var(--color-muted)}.profile-edit-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;color:#fff;background:#183b63;font-weight:800}.profile-edit-button svg{width:19px;height:19px}
    .profile-summary{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:18px 20px;border:1px solid var(--color-border);border-radius:8px;background:#fff;box-shadow:var(--shadow-small)}.profile-avatar{width:58px;height:58px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#183b63;font-size:21px;font-weight:800;background-size:cover;background-position:center}.profile-identity h2{margin:0 0 5px;font-size:22px}.profile-identity p{margin:0;color:var(--color-muted);font-size:14px}.profile-status{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;color:#047857;background:#d1fae5;font-size:12px;font-weight:800}.profile-status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.profile-status.inactive{color:#b4232e;background:#fff0f1}
    .profile-content{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.profile-content>.profile-card{display:block;align-items:stretch;justify-content:flex-start;padding:20px;text-align:left}.profile-content>.profile-card h3{display:flex;align-items:center;gap:9px;margin:0 0 9px;font-size:18px}.profile-content>.profile-card h3 span{width:32px;height:32px;display:grid;place-items:center;border-radius:7px;color:#183b63;background:#edf3f8}.profile-content>.profile-card h3 svg{width:18px;height:18px}.profile-field{display:grid;grid-template-columns:105px minmax(0,1fr);gap:16px;padding:11px 0;border-bottom:1px solid #e8edf2}.profile-field:last-child{border-bottom:0}.profile-field>span{color:var(--color-muted);font-size:13px}.profile-field>strong{min-width:0;font-size:14px;text-align:right;overflow-wrap:anywhere}.profile-notice{display:flex;align-items:flex-start;gap:10px;margin-top:14px;padding:13px 15px;border:1px solid #dbe6ef;border-radius:8px;color:#4b6076;background:#f8fafc;font-size:13px;line-height:1.6}.profile-notice svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px}.mobile-profile-action{display:none}
    @media(max-width:700px){.profile-page{width:calc(100% - 16px);padding-bottom:150px}.profile-topbar{margin-bottom:14px}.profile-heading{align-items:center;margin-bottom:12px}.profile-heading h1{font-size:24px}.profile-heading p{font-size:12px}.profile-heading>.profile-edit-button{display:none}.profile-summary{grid-template-columns:auto 1fr;gap:12px;padding:14px}.profile-avatar{width:48px;height:48px;font-size:18px}.profile-identity h2{font-size:19px}.profile-identity p{font-size:12px}.profile-status{grid-column:1/-1;width:fit-content;padding:5px 9px}.profile-content{grid-template-columns:1fr;gap:10px;margin-top:10px}.profile-content>.profile-card{display:block!important;padding:15px}.profile-content>.profile-card h3{font-size:17px}.profile-field{grid-template-columns:92px minmax(0,1fr);gap:10px;padding:10px 0}.profile-field>span{font-size:12px}.profile-field>strong{font-size:13px}.profile-notice{margin-top:10px}.mobile-profile-action{position:fixed;right:8px;bottom:calc(78px + env(safe-area-inset-bottom));left:8px;z-index:950;display:flex;min-height:48px;box-shadow:0 8px 24px rgba(24,59,99,.2)}}
  </style>
</head>
<body>
  <main class="page profile-page">
    <header class="topbar profile-topbar">
      <a class="brand" href="index.html"><span class="brand-mark">兆</span><div><strong>智慧人資管理平台</strong><small>員工工作台</small></div></a>
      <div class="top-actions"><a class="round-button" href="index.html" title="返回員工首頁" aria-label="返回員工首頁"><span data-hr-icon="home"></span></a></div>
    </header>
    <section class="profile-heading">
      <div><h1>我的資料</h1><p>查看公司系統目前登記的個人與職務資訊。</p></div>
      <a class="profile-edit-button" href="profile-edit.html"><span data-hr-icon="history"></span>申請修改資料</a>
    </section>
    <section class="profile-summary">
      <div class="profile-avatar" id="profileAvatar">員</div>
      <div class="profile-identity"><h2 id="profileName">資料載入中</h2><p>員工編號 <span id="profileEmployeeNo">—</span>　·　<span id="profileDepartment">—</span>　·　<span id="profileJobTitle">—</span></p></div>
      <span class="profile-status" id="profileEmploymentStatus">在職</span>
    </section>
    <section class="profile-content">
      <article class="card profile-card">
        <h3><span data-hr-icon="user"></span>基本資料</h3>
        <div class="profile-field"><span>姓名</span><strong id="profileFullName">—</strong></div>
        <div class="profile-field"><span>電子郵件</span><strong id="profileEmail">—</strong></div>
        <div class="profile-field"><span>聯絡電話</span><strong id="profilePhone">—</strong></div>
      </article>
      <article class="card profile-card">
        <h3><span data-hr-icon="department"></span>職務資訊</h3>
        <div class="profile-field"><span>所屬部門</span><strong id="profileDepartmentDetail">—</strong></div>
        <div class="profile-field"><span>職稱</span><strong id="profileJobTitleDetail">—</strong></div>
        <div class="profile-field"><span>直屬主管</span><strong id="profileManager">—</strong></div>
        <div class="profile-field"><span>到職日期</span><strong id="profileHireDate">—</strong></div>
      </article>
    </section>
    <div class="profile-notice"><span data-hr-icon="history"></span><span>如資料有誤，請提出修改申請；內容將在系統管理者審核後更新。</span></div>
    <a class="profile-edit-button mobile-profile-action" href="profile-edit.html"><span data-hr-icon="history"></span>申請修改資料</a>
  </main>
  <nav class="mobile-nav" aria-label="員工手機導覽"><a href="index.html"><span></span><small>首頁</small></a><a href="leave-assistant.html"><span></span><small>請假</small></a><a href="notifications.html"><span></span><small>通知</small></a><a class="active" href="profile.html" aria-current="page"><span></span><small>我的</small></a></nav>
  <script src="../assets/js/api.js?v=20260819-profile-ux"></script>
  <script>
    (async()=>{try{
      const user=await getCurrentUser();const name=user.display_name||user.username;const department=user.department_name||"尚未分配部門";const jobTitle=user.job_title||user.role_label||"尚未設定職稱";const avatar=document.querySelector("#profileAvatar");
      if(user.avatar_data){avatar.textContent="";avatar.style.backgroundImage=`url(${user.avatar_data})`}else avatar.textContent=name.slice(0,1);
      document.querySelector("#profileName").textContent=name;document.querySelector("#profileEmployeeNo").textContent=user.employee_no||"—";document.querySelector("#profileDepartment").textContent=department;document.querySelector("#profileJobTitle").textContent=jobTitle;document.querySelector("#profileFullName").textContent=name;document.querySelector("#profileEmail").textContent=user.email||"尚未設定";document.querySelector("#profilePhone").textContent=user.phone||"尚未設定";document.querySelector("#profileDepartmentDetail").textContent=department;document.querySelector("#profileJobTitleDetail").textContent=jobTitle;document.querySelector("#profileManager").textContent=user.manager_name||"尚未設定";document.querySelector("#profileHireDate").textContent=user.hire_date||"尚未設定";
      const status=document.querySelector("#profileEmploymentStatus");status.textContent=user.is_active===false?"已停用":"在職";status.classList.toggle("inactive",user.is_active===false);
    }catch(error){window.location.href="../index.html?next=employee/profile.html"}})();
  </script>
</body>
</html>
