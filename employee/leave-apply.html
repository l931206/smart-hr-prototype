<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>請假申請｜智慧人資管理平台</title>

  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">

  <style>
    .leave-page {
      width: min(760px, calc(100% - 28px));
    }

    .leave-header {
      margin-bottom: 20px;
    }

    .leave-header h1 {
      margin: 0;
      font-size: 30px;
    }

    .leave-header p {
      margin: 8px 0 0;
      color: var(--color-muted);
      line-height: 1.7;
    }

    .leave-form {
      margin-top: 0;
    }

    .leave-balance {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #f0fdfa;
      color: var(--color-text-soft);
    }

    .leave-balance span {
      font-size: 14px;
    }

    .leave-balance strong {
      color: var(--color-primary);
      font-size: 22px;
    }

    .balance-note {
      margin-top: 6px;
      color: var(--color-muted);
      font-size: 12px;
    }

    .leave-summary {
      margin-bottom: 20px;
      padding: 16px;
      border: 1px solid var(--color-border);
      border-radius: 14px;
      background: #f8fafc;
    }

    .leave-summary h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 0;
      color: var(--color-text-soft);
      font-size: 14px;
    }

    .summary-row strong {
      color: var(--color-text);
    }

    .leave-actions {
      margin-top: 24px;
    }

    @media (max-width: 700px) {
      .leave-page {
        width: calc(100% - 20px);
      }

      .leave-header {
        margin-bottom: 14px;
      }

      .leave-header h1 {
        font-size: 24px;
      }

      .leave-header p {
        font-size: 14px;
      }

      .leave-form {
        padding: 18px;
      }

      .leave-balance {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
        padding: 15px;
      }

      .leave-balance strong {
        font-size: 20px;
      }

      .leave-summary {
        padding: 14px;
      }

      .summary-row {
        font-size: 13px;
      }

      .back {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="page leave-page">

    <a class="back" href="index.html">
      ← 返回員工首頁
    </a>

    <header class="leave-header">
      <h1>請假申請</h1>
      <p>
        填寫請假日期與原因，下一步會先讓你確認資料，
        再正式送出申請。
      </p>
    </header>

    <form
      class="form-card leave-form"
      id="leaveForm"
      action="leave-confirm.html"
    >
      <section class="leave-balance">
        <div>
          <span>本年度特休剩餘</span>
          <div class="balance-note">目前可使用的特休額度</div>
        </div>

        <strong>資料載入中…</strong>
      </section>

      <section class="leave-summary">
        <h2>申請人</h2>

        <div class="summary-row">
          <span>姓名</span>
          <strong>—</strong>
        </div>

        <div class="summary-row">
          <span>部門</span>
          <strong>所屬部門</strong>
        </div>

        <div class="summary-row">
          <span>直屬主管</span>
          <strong id="leaveManager">—</strong>
        </div>
      </section>

      <div class="form-group">
        <label for="leaveType">假別</label>

        <select
          id="leaveType"
          name="leaveType"
          required
        >
          <option value="">請選擇假別</option>
          <option>特休假</option>
          <option>事假</option>
          <option>病假</option>
          <option>公假</option>
          <option>家庭照顧假</option>
        </select>
      </div>

      <div class="two-column">
        <div class="form-group">
          <label for="startDate">開始日期</label>

          <input
            id="startDate"
            name="startDate"
            type="date"
            required
          >
        </div>

        <div class="form-group">
          <label for="endDate">結束日期</label>

          <input
            id="endDate"
            name="endDate"
            type="date"
            required
          >
        </div>
      </div>

      <div class="two-column">
        <div class="form-group">
          <label for="startTime">開始時段</label>

          <select
            id="startTime"
            name="startTime"
            required
          >
            <option>上午</option>
            <option>下午</option>
          </select>
        </div>

        <div class="form-group">
          <label for="endTime">結束時段</label>

          <select
            id="endTime"
            name="endTime"
            required
          >
            <option>下午</option>
            <option>上午</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="reason">請假原因</label>

        <textarea
          id="reason"
          name="reason"
          placeholder="請輸入請假原因"
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label for="attachment">附件</label>

        <input
          id="attachment"
          name="attachment"
          type="file"
          accept=".pdf,.jpg,.jpeg,.png"
        >

        <p class="help">
          病假或其他需要證明的假別，可上傳 PDF、JPG 或 PNG 文件。
        </p>
      </div>

      <div class="notice">
        送出前會先進入確認頁，請再次檢查假別、日期、時段與原因是否正確。
      </div>

      <div class="actions leave-actions">
        <button
          class="button primary"
          type="submit"
        >
          下一步：確認資料
        </button>

        <a
          class="button secondary"
          href="index.html"
        >
          取消
        </a>
      </div>
    </form>
  </main>

  <nav
    class="mobile-nav"
    aria-label="員工手機導覽"
  >
    <a href="index.html">
      <span>⌂</span>
      <small>首頁</small>
    </a>

    <a
      class="active"
      href="leave-apply.html"
      aria-current="page"
    >
      <span>＋</span>
      <small>請假</small>
    </a>

    <a href="notifications.html">
      <span>●</span>
      <small>通知</small>
    </a>

    <a href="profile.html">
      <span>人</span>
      <small>我的</small>
    </a>
  </nav>
  <script src="../assets/js/api.js?v=20260814-review1"></script>
  <script>
    document.querySelector("#leaveForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      try {
        const attachment = await encodeAttachment(form.attachment.files[0]);
        const payload = {
          leave_type: form.leaveType.value,
          start_date: form.startDate.value,
          end_date: form.endDate.value,
          start_time: form.startTime.value,
          end_time: form.endTime.value,
          reason: form.reason.value.trim(),
          ...attachment
        };
        sessionStorage.setItem("hr_leave_draft", JSON.stringify(payload));
        window.location.href = "leave-confirm.html";
      } catch (error) {
        alert(error.message || "送出申請失敗，請稍後再試。");
        button.disabled = false;
      }
    });
  </script>
  <script>
    (async () => {
      try {
        const [user, typePayload, balancePayload] = await Promise.all([getCurrentUser(), apiRequest("/leave-types/"), apiRequest("/leave-balances/")]);
        const leaveTypes = (Array.isArray(typePayload) ? typePayload : (typePayload.results || [])).filter((item) => item.is_active);
        const balances = Array.isArray(balancePayload) ? balancePayload : (balancePayload.results || []);
        const leaveTypeSelect = document.querySelector("#leaveType");
        if (leaveTypeSelect) leaveTypeSelect.innerHTML = `<option value="">請選擇假別</option>${leaveTypes.map((item) => `<option value="${item.name}">${item.name}</option>`).join("")}`;
        const balance = document.querySelector(".leave-balance strong");
        const rows = document.querySelectorAll(".leave-summary .summary-row strong");
        const updateBalance = () => {
          const selected = leaveTypes.find((item) => item.name === leaveTypeSelect?.value);
          const item = balances.find((entry) => entry.leave_type === selected?.id);
          if (balance) balance.textContent = item ? `${Number(item.remaining_days)} 天` : (selected?.deduct_quota ? "0 天" : "不扣除額度");
        };
        leaveTypeSelect?.addEventListener("change", updateBalance);
        const annual = leaveTypes.find((item) => item.code === "ANNUAL" || item.name.includes("特休"));
        const annualBalance = balances.find((entry) => entry.leave_type === annual?.id);
        if (balance) balance.textContent = annualBalance ? `${Number(annualBalance.remaining_days)} 天` : "請選擇假別";
        if (rows[0]) rows[0].textContent = user.display_name || user.username || "—";
        if (rows[1]) rows[1].textContent = user.department_name || "—";
        if (rows[2]) rows[2].textContent = user.manager_name || "尚未設定";
        const manager = user.manager_name || "尚未設定";
        const managerField = document.querySelector("#leaveManager");
        if (managerField) managerField.textContent = manager;
      } catch (error) {
        window.location.href = "../login.html?next=employee/leave-apply.html";
      }
    })();
  </script>
</body>
</html>
