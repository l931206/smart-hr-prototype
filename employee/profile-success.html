<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>修改申請已送出｜智慧人資管理平台</title>

<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/mobile.css">

<style>

.success-page{
display:grid;
place-items:center;
min-height:100vh;
padding:24px;
}

.success-card{
width:min(560px,100%);
padding:38px 30px;
text-align:center;
}

.success-icon{
width:84px;
height:84px;
margin:auto auto 20px;
display:grid;
place-items:center;
border-radius:50%;
background:var(--color-primary);
color:white;
font-size:38px;
box-shadow:0 14px 30px rgba(15,118,110,.24);
}

.success-card h1{
margin:0;
font-size:30px;
}

.success-card p{
max-width:430px;
margin:14px auto 0;
color:var(--color-muted);
line-height:1.8;
}

.reference{
margin-top:24px;
padding:16px;
border-radius:14px;
background:#f0fdfa;
}

.reference small{
display:block;
margin-bottom:6px;
color:var(--color-muted);
font-size:13px;
}

.reference strong{
font-size:18px;
color:var(--color-primary);
}

.success-actions{
margin-top:28px;
}

@media(max-width:700px){

.success-page{
padding:18px;
}

.success-card{
padding:28px 20px;
border-radius:22px;
}

.success-icon{
width:72px;
height:72px;
font-size:32px;
}

.success-card h1{
font-size:24px;
}

.success-card p{
font-size:14px;
}

.reference strong{
font-size:16px;
}

}

</style>

</head>

<body>

<div class="success-page">

<main class="card success-card">

<div class="success-icon">
✓
</div>

<h1>
修改申請已送出
</h1>

<p>
系統管理者將確認你的資料，
審核完成後會立即更新，
並同步通知到通知中心。
</p>

<div class="reference">

<small>
申請編號
</small>

<strong id="profileRequestNumber">—</strong>

</div>

<div class="actions success-actions">

<a
class="button primary"
href="index.html"
>
返回員工首頁
</a>

<a
class="button secondary"
href="profile.html"
>
查看我的資料
</a>

</div>

</main>

</div>

<script src="../assets/js/api.js?v=20260811-live43"></script>
<script>
  (async () => {
    const id = new URLSearchParams(location.search).get("id");
    if (!id) return;
    try {
      const requestItem = await apiRequest(`/profile-change-requests/${id}/`);
      document.querySelector("#profileRequestNumber").textContent = `PROFILE-${requestItem.id}`;
    } catch (error) {
      document.querySelector("#profileRequestNumber").textContent = "資料載入失敗";
    }
  })();
</script>
</body>
</html>
