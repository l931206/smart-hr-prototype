<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公告草稿已儲存｜智慧人資管理平台</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      text-decoration: none;
    }

    .card {
      width: min(580px, 100%);
      padding: 38px 30px;
      border: 1px solid #e5ebf2;
      border-radius: 28px;
      background: white;
      text-align: center;
      box-shadow: 0 20px 52px rgba(15, 23, 42, 0.1);
    }

    .icon {
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      color: white;
      background: #f59e0b;
      font-size: 36px;
      box-shadow: 0 14px 30px rgba(245, 158, 11, 0.22);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    p {
      max-width: 450px;
      margin: 14px auto 0;
      color: #718096;
      line-height: 1.75;
    }

    .info {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #fffbeb;
      text-align: left;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 8px 0;
    }

    .row span {
      color: #718096;
      font-size: 14px;
    }

    .row strong {
      color: #92400e;
      text-align: right;
    }

    .status {
      display: inline-flex;
      padding: 5px 10px;
      border-radius: 999px;
      color: #92400e;
      background: #fef3c7;
      font-size: 13px;
      font-weight: 800;
    }

    .notice {
      margin-top: 18px;
      padding: 16px;
      border-left: 4px solid #f59e0b;
      border-radius: 12px;
      background: #f8fafc;
      color: #475569;
      line-height: 1.7;
      text-align: left;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 800;
    }

    .primary {
      color: white;
      background: #0f766e;
    }

    .secondary {
      color: #475569;
      background: white;
      border: 1px solid #d8e2ec;
    }

    @media (max-width: 520px) {
      .card {
        padding: 32px 20px;
      }

      .row {
        flex-direction: column;
        gap: 4px;
      }

      .row strong {
        text-align: left;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon">📝</div>

    <h1>公告草稿已儲存</h1>

    <p>
      公告尚未發布，員工目前不會看到內容，
      也不會收到任何通知。
    </p>

    <section class="info">
      <div class="row">
        <span>公告標題</span>
        <strong>部門教育訓練規劃</strong>
      </div>

      <div class="row">
        <span>草稿編號</span>
        <strong>ANN-DRAFT-002</strong>
      </div>

      <div class="row">
        <span>最後儲存</span>
        <strong>—1 13:30</strong>
      </div>

      <div class="row">
        <span>目前狀態</span>
        <strong class="status">草稿</strong>
      </div>
    </section>

    <div class="notice">
      可從公告管理頁繼續編輯，確認內容後再正式發布。
    </div>

    <div class="actions">
      <a class="button primary" href="announcements.html">返回公告管理</a>
      <a class="button secondary" href="announcement-edit.html">繼續編輯草稿</a>
    </div>
  </main>
  <script src="../assets/js/api.js?v=b399a09"></script><script src="../assets/js/manager-workflow-data.js?v=20260811-1"></script>
</body>
</html>
