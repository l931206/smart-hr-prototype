<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>請假申請詳情｜智慧人資管理平台</title>

  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">

  <style>
    .request-detail-page {
      width: min(820px, calc(100% - 28px));
    }

    .request-detail-card {
      padding: 28px;
    }

    .request-detail-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      padding-bottom: 20px;
      border-bottom: 1px solid #edf1f5;
    }

    .request-employee {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .request-avatar {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      color: white;
      background: var(--color-primary);
      font-size: 20px;
      font-weight: 800;
    }

    .request-employee h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.4;
    }

    .request-employee p {
      margin: 6px 0 0;
      color: var(--color-muted);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .request-status {
      display: inline-flex;
      flex: 0 0 auto;
      padding: 6px 11px;
      border-radius: 999px;
      color: var(--color-warning);
      background: var(--color-warning-bg);
      font-size: 13px;
      font-weight: 800;
    }

    .request-info-box {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #f8fafc;
    }

    .request-info-row {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr);
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid #e8edf2;
    }

    .request-info-row:last-child {
      border-bottom: 0;
    }

    .request-info-row span {
      color: var(--color-muted);
      font-size: 14px;
    }

    .request-info-row strong {
      min-width: 0;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .request-warning {
      margin-top: 22px;
      border-left-color: #f59e0b;
      background: #fffbeb;
      color: #6b5b34;
    }

    .manager-comment {
      margin-top: 22px;
    }

    .request-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .request-actions .button {
      width: 100%;
    }

    .approve-button {
      color: white;
      background: var(--color-primary);
    }

    .reject-button {
      color: white;
      background: var(--color-danger);
    }

    @media (max-width: 700px) {
      .request-detail-page {
        width: calc(100% - 20px);
      }

      .request-detail-page .back {
        display: none;
      }

      .request-detail-card {
        padding: 18px;
      }

      .request-detail-head {
        flex-direction: column;
        gap: 10px;
        padding-bottom: 16px;
      }

      .request-avatar {
        width: 46px;
        height: 46px;
        font-size: 18px;
      }

      .request-employee h1 {
        font-size: 20px;
      }

      .request-employee p {
        font-size: 12px;
      }

      .request-info-box {
        margin-top: 18px;
        padding: 15px;
      }

      .request-info-row {
        grid-template-columns: 1fr;
        gap: 4px;
        padding: 10px 0;
      }

      .request-info-row span {
        font-size: 12px;
      }

      .request-info-row strong {
        font-size: 14px;
      }

      .request-warning {
        margin-top: 16px;
        font-size: 14px;
      }

      .manager-comment {
        margin-top: 16px;
      }

      .request-actions {
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="page request-detail-page">

    <a class="back" href="leave-requests.html">
      ← 返回請假審核
    </a>

    <section class="card request-detail-card">

      <header class="request-detail-head">
        <div class="request-employee">
          <div class="request-avatar">
            陳
          </div>

          <div>
            <h1 id="requestTitle">—的特休假申請</h1>
            <p id="requestNumber">申請編號：—</p>
          </div>
        </div>

        <span class="request-status" id="requestStatus">
          等待審核
        </span>
      </header>

      <section class="request-info-box">
        <div class="request-info-row">
          <span>所屬部門</span>
          <strong>所屬部門</strong>
        </div>

        <div class="request-info-row">
          <span>職稱</span>
          <strong>載入中</strong>
        </div>

        <div class="request-info-row">
          <span>假別</span>
          <strong>特休假</strong>
        </div>

        <div class="request-info-row">
          <span>請假日期</span>
          <strong>— 上午 至 — 下午</strong>
        </div>

        <div class="request-info-row">
          <span>請假天數</span>
          <strong>2 天</strong>
        </div>

        <div class="request-info-row">
          <span>剩餘特休</span>
          <strong>載入中</strong>
        </div>

        <div class="request-info-row">
          <span>請假原因</span>
          <strong>處理個人事務。</strong>
        </div>

        <div class="request-info-row">
          <span>附件</span>
          <strong>未上傳附件</strong>
        </div>

        <div class="request-info-row">
          <span>申請時間</span>
          <strong>— 13:45</strong>
        </div>
      </section>

      <div class="notice request-warning">
        核准後，系統會更新員工請假紀錄；
        退回時請填寫明確原因，方便員工重新調整申請。
      </div>

      <div class="form-group manager-comment">
        <label for="comment">主管備註</label>

        <textarea
          id="comment"
          name="comment"
          placeholder="核准時可填寫說明；退回時請務必填寫原因"
        ></textarea>

      </div>

      <div class="request-actions">
        <a
          class="button approve-button"
          id="approveRequest"
          href="approval-success.html"
        >
          核准申請
        </a>

        <a
          class="button reject-button"
          id="rejectRequest"
          href="rejection-success.html"
        >
          退回申請
        </a>

        <a
          class="button secondary"
          href="leave-requests.html"
        >
          稍後處理
        </a>
      </div>
    </section>
  </main>

  <nav
    class="mobile-nav"
    aria-label="主管手機導覽"
  >
    <a href="index.html">
      <span>⌂</span>
      <small>首頁</small>
    </a>

    <a
      class="active"
      href="leave-requests.html"
      aria-current="page"
    >
      <span>✓</span>
      <small>審核</small>
    </a>

    <a href="team.html">
      <span>人</span>
      <small>團隊</small>
    </a>

    <a href="notifications.html">
      <span>•••</span>
      <small>更多</small>
    </a>
  </nav>
  <script src="../assets/js/api.js?v=20260813-sso1"></script>
  <script>
    (async () => {
      const requestId = new URLSearchParams(window.location.search).get("id");
      if (!requestId) return;
      try {
        const request = await apiRequest(`/leave-requests/${requestId}/`);
        const balancePayload = await apiRequest("/leave-balances/");
        const balances = Array.isArray(balancePayload) ? balancePayload : (balancePayload.results || []);
        const balance = balances.find((item) => item.employee === request.employee && item.leave_type_name === request.leave_type);
        document.querySelector("#requestTitle").textContent = `${request.employee_name}的${request.leave_type}申請`;
        document.querySelector("#requestNumber").textContent = `申請編號：LEAVE-${String(request.id).padStart(6, "0")}`;
        document.querySelector("#requestStatus").textContent = request.status_label;
        const values = document.querySelectorAll(".request-info-row strong");
        values[0].textContent = request.employee_department || "—";
        values[1].textContent = request.employee_job_title || "未設定職稱";
        values[2].textContent = request.leave_type;
        values[3].textContent = `${request.start_date} ${request.start_time} 至 ${request.end_date} ${request.end_time}`;
        values[4].textContent = `${request.days} 天`;
        values[5].textContent = balance ? `${Number(balance.remaining_days)} 天` : "不適用";
        values[6].textContent = request.reason;
        values[7].textContent = request.attachment_name || "未上傳附件";
        if (request.attachment_data) { values[7].style.cursor = "pointer"; values[7].title = "點擊下載附件"; values[7].addEventListener("click", () => downloadAttachment(request.attachment_name, request.attachment_data)); }
        values[8].textContent = new Date(request.created_at).toLocaleString("zh-TW");
        const updateStatus = async (event, status, target) => {
          event.preventDefault();
          const button = event.currentTarget;
          const comment = document.querySelector("#comment").value.trim();
          if (status === "rejected" && !comment) {
            alert("退回申請時請填寫主管備註。");
            return;
          }
          button.setAttribute("aria-busy", "true");
          button.style.pointerEvents = "none";
          try {
            await apiRequest(`/leave-requests/${request.id}/`, {
              method: "PATCH",
              body: JSON.stringify({ status, reviewer_comment: comment })
            });
            window.location.href = `${target}?id=${request.id}`;
          } catch (error) {
            button.removeAttribute("aria-busy");
            button.style.pointerEvents = "auto";
            alert(error.message || "更新申請狀態失敗，請稍後再試。");
          }
        };
        document.querySelector("#approveRequest").addEventListener("click", (event) => updateStatus(event, "approved", "approval-success.html"));
        document.querySelector("#rejectRequest").addEventListener("click", (event) => updateStatus(event, "rejected", "rejection-success.html"));
      } catch (error) {
        alert(error.message || "無法載入申請資料。");
      }
    })();
  </script>
</body>
</html>
