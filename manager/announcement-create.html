<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>發布新公告｜智慧人資管理平台</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(820px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .back {
      display: inline-flex;
      margin-bottom: 22px;
      color: #0f766e;
      font-weight: 800;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      color: #718096;
      line-height: 1.7;
    }

    .form-card {
      margin-top: 22px;
      padding: 26px;
      border: 1px solid #e5ebf2;
      border-radius: 24px;
      background: white;
      box-shadow: 0 14px 38px rgba(15, 23, 42, 0.07);
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 800;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d8e2ec;
      border-radius: 12px;
      background: white;
      color: #18212f;
      font: inherit;
      outline: none;
    }

    input,
    select {
      min-height: 46px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
    }

    .help {
      margin: 7px 0 0;
      color: #8290a3;
      font-size: 13px;
      line-height: 1.6;
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 16px;
      border-radius: 14px;
      background: #f8fafc;
    }

    .checkbox-row input {
      width: 18px;
      height: 18px;
      min-height: auto;
      margin-top: 2px;
      flex: 0 0 auto;
    }

    .checkbox-row label {
      margin: 0;
      line-height: 1.6;
    }

    .notice {
      margin-top: 22px;
      padding: 16px 18px;
      border-left: 4px solid #0f766e;
      border-radius: 12px;
      background: #f0fdfa;
      color: #475569;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 26px;
    }

    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      color: white;
      background: #0f766e;
    }

    .secondary {
      color: #475569;
      background: white;
      border: 1px solid #d8e2ec;
    }

    @media (max-width: 620px) {
      .form-card {
        padding: 22px 18px;
      }

      .two-column {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="back" href="announcements.html">← 返回公告管理</a>

    <header class="header">
      <h1>發布新公告</h1>
      <p>建立部門公告，設定發布範圍與公告期間。</p>
    </header>

    <form class="form-card" action="announcement-create-success.html">
      <div class="form-group">
        <label for="title">公告標題</label>
        <input
          id="title"
          type="text"
          placeholder="請輸入公告標題"
          required
        >
      </div>

      <div class="two-column">
        <div class="form-group">
          <label for="type">公告類型</label>
          <select id="type" required>
            <option value="">請選擇公告類型</option>
            <option>部門公告</option>
            <option>行政通知</option>
            <option>人事公告</option>
            <option>系統通知</option>
            <option>緊急通知</option>
          </select>
        </div>

        <div class="form-group">
          <label for="audience">發布範圍</label>
          <select id="audience" required>
            <option selected>所屬部門全體員工</option>
            <option>所屬部門主管</option>
            <option>所屬部門指定員工</option>
            <option>全公司員工</option>
          </select>
          <p class="help">全公司公告可再由系統管理者確認發布權限。</p>
        </div>
      </div>

      <div class="two-column">
        <div class="form-group">
          <label for="publishDate">發布日期</label>
          <input id="publishDate" type="date" required>
        </div>

        <div class="form-group">
          <label for="endDate">下架日期</label>
          <input id="endDate" type="date">
          <p class="help">未填寫代表公告持續顯示，直到手動下架。</p>
        </div>
      </div>

      <div class="form-group">
        <label for="content">公告內容</label>
        <textarea
          id="content"
          placeholder="請輸入完整公告內容"
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label for="attachment">附件</label>
        <input id="attachment" type="file">
        <p class="help">可上傳活動資訊、行程表或相關文件。</p>
      </div>

      <div class="checkbox-row">
        <input id="notify" type="checkbox" checked>

        <label for="notify">
          發布後同步傳送通知給公告範圍內的員工。
        </label>
      </div>

      <div class="notice">
        選擇「立即發布」後，公告會出現在員工首頁與公告中心；儲存草稿則不會通知員工。
      </div>

      <div class="actions">
        <button class="button primary" type="submit">立即發布</button>
        <button class="button secondary" id="saveDraft" type="button">儲存草稿</button>
        <a class="button secondary" href="announcements.html">取消</a>
      </div>
    </form>
  </main>
  <script src="../assets/js/api.js?v=20260814-review1"></script>
  <script>
    document.querySelector(".form-card").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const categoryMap = { "部門公告": "company", "行政通知": "admin", "人事公告": "hr", "緊急通知": "system" };
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      try {
        const attachment = await encodeAttachment(form.querySelector("#attachment").files[0]);
        const item = await apiRequest("/announcements/", {
          method: "POST",
          body: JSON.stringify({
            title: form.querySelector("#title").value.trim(),
            category: categoryMap[form.querySelector("#type").value] || "company",
            content: form.querySelector("#content").value.trim(),
            is_published: true,
            ...attachment
          })
        });
        window.location.href = `announcement-detail.html?id=${item.id}&notice=${encodeURIComponent("公告已發布")}`;
      } catch (error) {
        button.disabled = false;
        alert(error.message || "公告發布失敗");
      }
    });
    document.querySelector("#saveDraft").addEventListener("click", async (event) => {
      const button = event.currentTarget;
      const form = document.querySelector(".form-card");
      const categoryMap = { "部門公告": "company", "行政通知": "admin", "人事公告": "hr", "緊急通知": "system" };
      button.disabled = true;
      try {
        const attachment = await encodeAttachment(form.querySelector("#attachment").files[0]);
        const item = await apiRequest("/announcements/", {method:"POST", body:JSON.stringify({title:form.querySelector("#title").value.trim(), category:categoryMap[form.querySelector("#type").value] || "company", content:form.querySelector("#content").value.trim(), is_published:false, ...attachment})});
        window.location.href = `announcement-detail.html?id=${item.id}&notice=${encodeURIComponent("公告草稿已儲存")}`;
      } catch (error) { button.disabled = false; alert(error.message || "儲存草稿失敗"); }
    });
  </script>
</body>
</html>
