<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>審核紀錄｜智慧人資管理平台</title>

  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">

  <style>
    .approval-history-page {
      width: min(1000px, calc(100% - 28px));
    }

    .approval-history-header h1 {
      margin: 0;
      font-size: 30px;
    }

    .approval-history-header p {
      margin: 8px 0 0;
      color: var(--color-muted);
      line-height: 1.7;
    }

    .approval-history-summary {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .approval-history-filter {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      padding: 18px;
      border: 1px solid var(--color-border);
      border-radius: 18px;
      background: var(--color-surface);
    }

    .approval-history-filter input {
      flex: 1;
    }

    .approval-history-list {
      display: grid;
      gap: 16px;
      margin-top: 18px;
    }

    .approval-history-card {
      padding: 22px;
      border: 1px solid var(--color-border);
      border-radius: 20px;
      background: var(--color-surface);
      box-shadow: var(--shadow-small);
    }

    .approval-history-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .approval-history-employee {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .approval-history-avatar {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      color: white;
      background: var(--color-primary);
      font-weight: 800;
    }

    .approval-history-employee h2 {
      margin: 0;
      font-size: 19px;
      line-height: 1.4;
    }

    .approval-history-employee p {
      margin: 5px 0 0;
      color: var(--color-muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .approval-history-status {
      display: inline-flex;
      flex: 0 0 auto;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
    }

    .approval-history-status.approved {
      color: var(--color-success);
      background: var(--color-success-bg);
    }

    .approval-history-status.rejected {
      color: var(--color-danger);
      background: var(--color-danger-bg);
    }

    .approval-history-details {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #edf1f5;
    }

    .approval-history-detail span {
      display: block;
      margin-bottom: 6px;
      color: var(--color-muted);
      font-size: 13px;
    }

    .approval-history-detail strong {
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .approval-history-comment {
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: #f8fafc;
      color: var(--color-text-soft);
      line-height: 1.7;
    }

    .approval-history-link {
      display: inline-flex;
      margin-top: 18px;
      color: var(--color-primary);
      font-weight: 800;
    }

    @media (max-width: 760px) {
      .approval-history-page {
        width: calc(100% - 20px);
      }

      .approval-history-page .back {
        display: none;
      }

      .approval-history-header h1 {
        font-size: 24px;
      }

      .approval-history-header p {
        font-size: 14px;
      }

      .approval-history-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .approval-history-summary .summary-card:last-child {
        grid-column: 1 / -1;
      }

      .approval-history-filter {
        flex-direction: column;
        gap: 10px;
        padding: 14px;
      }

      .approval-history-card {
        padding: 17px;
        border-radius: 17px;
      }

      .approval-history-head {
        flex-direction: column;
        gap: 10px;
      }

      .approval-history-avatar {
        width: 42px;
        height: 42px;
      }

      .approval-history-employee h2 {
        font-size: 16px;
      }

      .approval-history-employee p {
        font-size: 12px;
      }

      .approval-history-details {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 15px;
        padding-top: 14px;
      }

      .approval-history-detail span {
        font-size: 11px;
      }

      .approval-history-detail strong {
        font-size: 13px;
      }

      .approval-history-comment {
        margin-top: 14px;
        padding: 13px;
        font-size: 13px;
      }

      .approval-history-link {
        margin-top: 13px;
        font-size: 14px;
      }
    }

    @media (max-width: 430px) {
      .approval-history-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="page approval-history-page">

    <a class="back" href="index.html">
      ← 返回主管工作台
    </a>

    <header class="approval-history-header">
      <h1>審核紀錄</h1>
      <p>
        查看你已完成的請假核准與退回紀錄。
      </p>
    </header>

    <section class="summary-grid approval-history-summary">
      <article class="summary-card">
        <span>本月已處理</span>
        <strong>0</strong>
      </article>

      <article class="summary-card">
        <span>已核准</span>
        <strong>0</strong>
      </article>

      <article class="summary-card">
        <span>已退回</span>
        <strong>0</strong>
      </article>
    </section>

    <section class="approval-history-filter">
      <input
        type="search"
        placeholder="搜尋員工姓名或申請編號"
        aria-label="搜尋審核紀錄"
      >

      <select aria-label="篩選處理結果">
        <option>全部處理結果</option>
        <option>已核准</option>
        <option>已退回</option>
      </select>

      <select aria-label="篩選假別">
        <option>全部假別</option>
        <option>特休假</option>
        <option>病假</option>
        <option>事假</option>
      </select>
    </section>

    <section class="approval-history-list" id="approvalHistoryList">
      <p class="empty-state">資料載入中…</p>
    </section>
  </main>

  <nav
    class="mobile-nav"
    aria-label="主管手機導覽"
  >
    <a href="index.html">
      <span>⌂</span>
      <small>首頁</small>
    </a>

    <a
      class="active"
      href="leave-requests.html"
      aria-current="page"
    >
      <span>✓</span>
      <small>審核</small>
    </a>

    <a href="team.html">
      <span>人</span>
      <small>團隊</small>
    </a>

    <a href="notifications.html">
      <span>•••</span>
      <small>更多</small>
    </a>
  </nav>
  <script src="../assets/js/api.js?v=20260811-live47"></script>
  <script>
    (async () => {
      const list = document.querySelector("#approvalHistoryList");
      try {
        const payload = await apiRequest("/leave-requests/");
        const requests = (Array.isArray(payload) ? payload : (payload.results || [])).filter((item) => ["approved", "rejected"].includes(item.status));
        const counts = document.querySelectorAll(".summary-grid .summary-card strong");
        if (counts[0]) counts[0].textContent = String(requests.length);
        if (counts[1]) counts[1].textContent = String(requests.filter((item) => item.status === "approved").length);
        if (counts[2]) counts[2].textContent = String(requests.filter((item) => item.status === "rejected").length);
        const formatDate = (value) => value ? new Date(value).toLocaleString("zh-TW") : "—";
        const search = document.querySelector('input[type="search"]');
        const filters = document.querySelectorAll(".approval-history-filter select");
        const leaveTypes = [...new Set(requests.map((item) => item.leave_type).filter(Boolean))];
        if (filters[1]) filters[1].innerHTML = `<option value="">全部假別</option>${leaveTypes.map((name) => `<option value="${name}">${name}</option>`).join("")}`;
        const render = () => {
          const keyword = (search?.value || "").trim().toLowerCase();
          const statusText = filters[0]?.value || "全部處理結果";
          const typeText = filters[1]?.value || "";
          const statusMap = {"已核准":"approved", "已退回":"rejected"};
          const filtered = requests.filter((item) => `${item.employee_name || ""} ${item.leave_type || ""} ${item.reason || ""}`.toLowerCase().includes(keyword) && (!statusMap[statusText] || item.status === statusMap[statusText]) && (!typeText || item.leave_type === typeText));
          list.innerHTML = filtered.map((item) => `<article class="approval-history-card"><div class="approval-history-head"><div class="approval-history-employee"><div class="approval-history-avatar">${(item.employee_name || "員").slice(0, 1)}</div><div><h2>${item.employee_name || "未提供姓名"}－${item.leave_type}</h2><p>申請編號：LEAVE-${String(item.id).padStart(6, "0")}</p></div></div><span class="approval-history-status ${item.status === "approved" ? "approved" : "rejected"}">${item.status_label}</span></div><div class="approval-history-details"><div class="approval-history-detail"><span>請假日期</span><strong>${item.start_date}－${item.end_date}</strong></div><div class="approval-history-detail"><span>請假天數</span><strong>${item.days} 天</strong></div><div class="approval-history-detail"><span>處理時間</span><strong>${formatDate(item.reviewed_at)}</strong></div><div class="approval-history-detail"><span>處理人</span><strong>目前登入主管</strong></div></div><div class="approval-history-comment">${item.reviewer_comment || "未填寫主管備註。"}</div><a class="approval-history-link" href="approval-record-detail.html?id=${item.id}">查看完整審核紀錄 →</a></article>`).join("") || "<p>目前沒有符合條件的審核紀錄。</p>";
        };
        [search, ...filters].filter(Boolean).forEach((element) => element.addEventListener("input", render));
        render();
      } catch (error) { list.innerHTML = `<p>${error.message || "無法載入審核紀錄。"}</p>`; }
    })();
  </script>
</body>
</html>
