<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>主管通知｜智慧人資管理平台</title>

  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">

  <style>
    .manager-notification-page {
      width: min(900px, calc(100% - 28px));
    }

    .manager-notification-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .manager-mark-read {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      color: var(--color-primary);
      background: var(--color-surface);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .manager-notification-header h1 {
      margin: 0;
      font-size: 30px;
    }

    .manager-notification-header p {
      margin: 8px 0 0;
      color: var(--color-muted);
      line-height: 1.7;
    }

    .manager-notification-summary {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .manager-notification-list {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .manager-notification-card {
      display: block;
      padding: 20px 22px;
      border: 1px solid var(--color-border);
      border-radius: 18px;
      background: var(--color-surface);
      box-shadow: var(--shadow-small);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .manager-notification-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-medium);
    }

    .manager-notification-card.unread {
      border-left: 5px solid var(--color-primary);
      background: #f7fffd;
    }

    .manager-notification-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
    }

    .manager-notification-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .manager-notification-title h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.4;
    }

    .manager-notification-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--color-primary);
    }

    .manager-notification-time {
      flex: 0 0 auto;
      color: #8290a3;
      font-size: 13px;
      white-space: nowrap;
    }

    .manager-notification-message {
      margin: 10px 0 0;
      color: #5f6f82;
      line-height: 1.7;
    }

    .manager-notification-tag {
      display: inline-flex;
      margin-top: 14px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .tag-approval {
      color: var(--color-warning);
      background: var(--color-warning-bg);
    }

    .tag-late {
      color: #1d4ed8;
      background: #dbeafe;
    }

    .tag-warning {
      color: var(--color-danger);
      background: var(--color-danger-bg);
    }

    .tag-system {
      color: var(--color-success);
      background: var(--color-success-bg);
    }

    @media (max-width: 700px) {
      .manager-notification-page {
        width: calc(100% - 20px);
      }

      .manager-notification-topbar {
        align-items: stretch;
        flex-direction: column;
        margin-bottom: 14px;
      }

      .manager-notification-topbar .back {
        display: none;
      }

      .manager-mark-read {
        width: 100%;
      }

      .manager-notification-header h1 {
        font-size: 24px;
      }

      .manager-notification-header p {
        font-size: 14px;
      }

      .manager-notification-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .manager-notification-summary .summary-card:last-child {
        grid-column: 1 / -1;
      }

      .manager-notification-card {
        padding: 17px;
        border-radius: 17px;
      }

      .manager-notification-head {
        flex-direction: column;
        gap: 7px;
      }

      .manager-notification-title h2 {
        font-size: 16px;
      }

      .manager-notification-time {
        font-size: 12px;
        white-space: normal;
      }

      .manager-notification-message {
        font-size: 13px;
      }

      .manager-notification-tag {
        margin-top: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="page manager-notification-page">

    <div class="manager-notification-topbar">
      <a class="back" href="index.html">
        ← 返回主管工作台
      </a>

      <button
        class="manager-mark-read"
        type="button"
      >
        全部標示為已讀
      </button>
    </div>

    <header class="manager-notification-header">
      <h1>主管通知</h1>

      <p>
        查看請假申請、員工晚到與部門人力提醒。
      </p>
    </header>

    <section class="summary-grid manager-notification-summary">
      <article class="summary-card">
        <span>未讀通知</span>
        <strong>0</strong>
      </article>

      <article class="summary-card">
        <span>待處理事項</span>
        <strong>0</strong>
      </article>

      <article class="summary-card">
        <span>全部通知</span>
        <strong>0</strong>
      </article>
    </section>

    <section class="manager-notification-list" id="managerNotificationList">
      <p class="empty-state">資料載入中…</p>
    </section>
  </main>

  <nav
    class="mobile-nav"
    aria-label="主管手機導覽"
  >
    <a href="index.html">
      <span>⌂</span>
      <small>首頁</small>
    </a>

    <a href="leave-requests.html">
      <span>✓</span>
      <small>審核</small>
    </a>

    <a href="team.html">
      <span>人</span>
      <small>團隊</small>
    </a>

    <a
      class="active"
      href="notifications.html"
      aria-current="page"
    >
      <span>•••</span>
      <small>更多</small>
    </a>
  </nav>
</body>
  <script src="../assets/js/api.js?v=20260817-review2"></script>
  <script>
    (async () => {
      try {
        const payload = await apiRequest("/notifications/");
        const notifications = Array.isArray(payload) ? payload : (payload.results || []);
        const counts = document.querySelectorAll(".manager-notification-summary .summary-card strong");
        if (counts[0]) counts[0].textContent = String(notifications.filter((item) => !item.is_read).length);
        if (counts[1]) counts[1].textContent = String(notifications.filter((item) => item.category === "leave" && !item.is_read).length);
        if (counts[2]) counts[2].textContent = String(notifications.length);
        document.querySelector("#managerNotificationList").innerHTML = notifications.map((item) => `<a class="manager-notification-card ${item.is_read ? "" : "unread"}" href="notification-detail.html?id=${Number(item.id)}"><div class="manager-notification-head"><div class="manager-notification-title"><span class="manager-notification-dot"></span><h2>${hrEscapeHtml(item.title)}</h2></div><span class="manager-notification-time">${hrEscapeHtml(new Date(item.created_at).toLocaleString("zh-TW"))}</span></div><p class="manager-notification-message">${hrEscapeHtml(item.content)}</p><span class="manager-notification-tag tag-system">${item.category === "leave" ? "請假" : "系統通知"}</span></a>`).join("") || "<p>目前沒有通知。</p>";
        const markAll = document.querySelector(".manager-mark-read");
        markAll?.addEventListener("click", async () => {
          markAll.disabled = true;
          await Promise.all(notifications.filter((item) => !item.is_read).map((item) => apiRequest(`/notifications/${item.id}/`, { method: "PATCH", body: JSON.stringify({ is_read: true }) })));
          window.location.reload();
        });
      } catch (error) { document.querySelector("#managerNotificationList").innerHTML = `<p>${hrEscapeHtml(error.message || "無法載入通知。")}</p>`; }
    })();
  </script>
</html>
