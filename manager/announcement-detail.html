<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公告詳情｜智慧人資管理平台</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(820px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .back {
      display: inline-flex;
      margin-bottom: 22px;
      color: #0f766e;
      font-weight: 800;
    }

    .card {
      padding: 30px;
      border: 1px solid #e5ebf2;
      border-radius: 24px;
      background: white;
      box-shadow: 0 14px 38px rgba(15, 23, 42, 0.07);
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      padding-bottom: 22px;
      border-bottom: 1px solid #edf1f5;
    }

    .head h1 {
      margin: 14px 0 0;
      font-size: 29px;
    }

    .status {
      display: inline-flex;
      flex: 0 0 auto;
      padding: 7px 12px;
      border-radius: 999px;
      color: #047857;
      background: #d1fae5;
      font-size: 13px;
      font-weight: 800;
    }

    .tag {
      display: inline-flex;
      padding: 6px 11px;
      border-radius: 999px;
      color: #0f766e;
      background: #f0fdfa;
      font-size: 13px;
      font-weight: 800;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 14px;
      color: #718096;
      font-size: 14px;
    }

    .content {
      margin-top: 24px;
      color: #475569;
      line-height: 1.9;
    }

    .content h2 {
      margin: 26px 0 10px;
      color: #18212f;
      font-size: 20px;
    }

    .content p {
      margin: 0 0 16px;
    }

    .info-box {
      margin-top: 18px;
      padding: 18px;
      border-left: 4px solid #0f766e;
      border-radius: 12px;
      background: #f0fdfa;
    }

    .row {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 14px;
      padding: 10px 0;
    }

    .row span {
      color: #718096;
      font-size: 14px;
    }

    .attachment {
      margin-top: 22px;
      padding: 18px;
      border-radius: 14px;
      background: #f8fafc;
    }

    .attachment h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .file {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 13px;
      border: 1px solid #e5ebf2;
      border-radius: 12px;
      background: white;
    }

    .file span {
      color: #0f766e;
      font-size: 13px;
      font-weight: 800;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 26px;
    }

    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 800;
    }

    .primary {
      color: white;
      background: #0f766e;
    }

    .secondary {
      color: #475569;
      background: white;
      border: 1px solid #d8e2ec;
    }

    .danger {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    @media (max-width: 620px) {
      .card {
        padding: 22px 18px;
      }

      .head,
      .file,
      .actions {
        align-items: flex-start;
        flex-direction: column;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="back" href="announcements.html">← 返回公告管理</a>

    <article class="card">
      <header class="head">
        <div>
          <span class="tag">載入中</span>
          <h1>公告載入中</h1>

          <div class="meta">
            <span>公告編號：—</span>
            <span>發布人：—</span>
            <span>發布時間：載入中</span>
          </div>
        </div>

        <span class="status">載入中</span>
      </header>

      <section class="content">
        <p>公告內容載入中</p>
      </section>

      <section class="attachment">
        <h2>附件</h2>

        <p>附件資料載入中</p>
      </section>

      <div class="actions">
        <a class="button primary" href="announcement-edit.html">編輯公告</a>
        <a class="button danger" href="announcement-deactivate.html">下架公告</a>
        <a class="button secondary" href="announcements.html">返回公告管理</a>
      </div>
    </article>
  </main>
  <script src="../assets/js/api.js?v=20260814-review1"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) return;
      try {
        const item = await apiRequest(`/announcements/${id}/`);
        document.querySelector(".card h1").textContent = item.title;
        document.querySelector(".tag").textContent = item.category_label || "未分類";
        const meta = document.querySelectorAll(".meta span");
        if (meta[0]) meta[0].textContent = `公告編號：ANN-${item.id}`;
        if (meta[1]) meta[1].textContent = `發布人：${item.author_name || "—"}`;
        if (meta[2]) meta[2].textContent = `發布時間：${item.published_at ? new Date(item.published_at).toLocaleString("zh-TW") : "尚未發布"}`;
        document.querySelector(".status").textContent = item.is_published ? "已發布" : "草稿";
        const content = document.querySelector(".content");
        content.innerHTML = "";
        const paragraph = document.createElement("p");
        paragraph.textContent = item.content || "目前沒有公告內容。";
        content.appendChild(paragraph);
        document.querySelector('a[href="announcement-edit.html"]').href = `announcement-edit.html?id=${id}`;
        document.querySelector('a[href="announcement-deactivate.html"]').href = `announcement-deactivate.html?id=${id}`;
        const attachment = document.querySelector(".attachment");
        if (attachment) {
          attachment.innerHTML = item.attachment_data ? `<h2>附件</h2><button class="file" type="button"><strong>${item.attachment_name}</strong><span>下載附件</span></button>` : "<h2>附件</h2><p>目前沒有附件。</p>";
          attachment.querySelector("button")?.addEventListener("click", () => downloadAttachment(item.attachment_name, item.attachment_data));
        }
        document.title = `${item.title} - 公告詳情`;
      } catch (error) {
        const content = document.querySelector(".content");
        if (content) content.textContent = `無法載入公告：${error.message}`;
      }
    })();
  </script>
</body>
</html>
