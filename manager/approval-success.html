<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>請假申請已核准｜智慧人資管理平台</title>

  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">

  <style>
    .success-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .success-card {
      width: min(560px, 100%);
      padding: 38px 30px;
      text-align: center;
    }

    .success-icon {
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      color: white;
      background: var(--color-primary);
      font-size: 38px;
      box-shadow: 0 14px 30px rgba(15, 118, 110, 0.24);
    }

    .success-card h1 {
      margin: 0;
      font-size: 30px;
    }

    .success-card > p {
      max-width: 430px;
      margin: 14px auto 0;
      color: var(--color-muted);
      line-height: 1.75;
    }

    .approval-info {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #f0fdfa;
      text-align: left;
    }

    .approval-info-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 9px 0;
    }

    .approval-info-row span {
      color: var(--color-muted);
      font-size: 14px;
    }

    .approval-info-row strong {
      color: var(--color-primary);
      text-align: right;
      overflow-wrap: anywhere;
    }

    .approval-status {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--color-success);
      background: var(--color-success-bg);
      font-size: 13px;
      font-weight: 800;
    }

    .approval-notice {
      margin-top: 18px;
      text-align: left;
    }

    .success-actions {
      justify-content: center;
      margin-top: 28px;
    }

    @media (max-width: 700px) {
      .success-page {
        align-items: start;
        padding: 18px 10px 100px;
      }

      .success-card {
        margin-top: 18px;
        padding: 28px 20px;
        border-radius: 22px;
      }

      .success-icon {
        width: 72px;
        height: 72px;
        font-size: 32px;
      }

      .success-card h1 {
        font-size: 24px;
      }

      .success-card > p {
        font-size: 14px;
      }

      .approval-info {
        padding: 15px;
      }

      .approval-info-row {
        flex-direction: column;
        gap: 4px;
        padding: 8px 0;
      }

      .approval-info-row span {
        font-size: 12px;
      }

      .approval-info-row strong {
        text-align: left;
        font-size: 14px;
      }

      .approval-notice {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="success-page">
    <main class="card success-card">

      <div class="success-icon">
        ✓
      </div>

      <h1>請假申請已核准</h1>

      <p>
        系統已更新員工的請假狀態，
        並將核准結果傳送給申請人。
      </p>

      <section class="approval-info">
        <div class="approval-info-row">
          <span>申請人</span>
          <strong>—</strong>
        </div>

        <div class="approval-info-row">
          <span>申請編號</span>
          <strong>—</strong>
        </div>

        <div class="approval-info-row">
          <span>假別</span>
          <strong>特休假</strong>
        </div>

        <div class="approval-info-row">
          <span>請假日期</span>
          <strong>—－—</strong>
        </div>

        <div class="approval-info-row">
          <span>處理結果</span>
          <strong class="approval-status">
            已核准
          </strong>
        </div>
      </section>

      <div class="notice approval-notice">
        此筆申請已從待審核清單移除，
        並保留在審核紀錄中供後續查詢。
      </div>

      <div class="actions success-actions">
        <a
          class="button primary"
          href="leave-requests.html"
        >
          繼續審核下一筆
        </a>

        <a
          class="button secondary"
          href="approval-history.html"
        >
          查看審核紀錄
        </a>

        <a
          class="button secondary"
          href="index.html"
        >
          返回主管工作台
        </a>
      </div>
    </main>
  </div>

  <nav
    class="mobile-nav"
    aria-label="主管手機導覽"
  >
    <a href="index.html">
      <span>⌂</span>
      <small>首頁</small>
    </a>

    <a
      class="active"
      href="leave-requests.html"
      aria-current="page"
    >
      <span>✓</span>
      <small>審核</small>
    </a>

    <a href="team.html">
      <span>人</span>
      <small>團隊</small>
    </a>

    <a href="notifications.html">
      <span>•••</span>
      <small>更多</small>
    </a>
  </nav>
  <script src="../assets/js/api.js?v=20260811-live45"></script><script src="../assets/js/manager-workflow-data.js?v=20260811-live45"></script>
</body>
</html>
