<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>請假申請已退回｜智慧人資管理平台</title>

  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">

  <style>
    .result-page{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .result-card{
      width:min(560px,100%);
      padding:38px 30px;
      text-align:center;
    }

    .result-icon{
      width:84px;
      height:84px;
      display:grid;
      place-items:center;
      margin:auto auto 20px;
      border-radius:50%;
      color:#fff;
      background:var(--color-danger);
      font-size:38px;
      box-shadow:0 14px 30px rgba(185,28,28,.22);
    }

    .result-card h1{
      margin:0;
      font-size:30px;
    }

    .result-card>p{
      max-width:430px;
      margin:14px auto 0;
      color:var(--color-muted);
      line-height:1.75;
    }

    .result-info{
      margin-top:22px;
      padding:18px;
      border-radius:16px;
      background:#fff7f7;
      text-align:left;
    }

    .result-row{
      display:flex;
      justify-content:space-between;
      gap:18px;
      padding:9px 0;
    }

    .result-row span{
      color:var(--color-muted);
      font-size:14px;
    }

    .result-row strong{
      color:var(--color-danger);
      text-align:right;
      overflow-wrap:anywhere;
    }

    .reject-status{
      display:inline-flex;
      align-items:center;
      padding:5px 10px;
      border-radius:999px;
      color:var(--color-danger);
      background:var(--color-danger-bg);
      font-size:13px;
      font-weight:800;
    }

    .reason-box{
      margin-top:18px;
      padding:15px;
      border-radius:12px;
      background:#fff;
      line-height:1.7;
      color:var(--color-text-soft);
    }

    .result-actions{
      justify-content:center;
      margin-top:28px;
    }

    @media(max-width:700px){

      .result-page{
        align-items:start;
        padding:18px 10px 100px;
      }

      .result-card{
        margin-top:18px;
        padding:28px 20px;
        border-radius:22px;
      }

      .result-icon{
        width:72px;
        height:72px;
        font-size:32px;
      }

      .result-card h1{
        font-size:24px;
      }

      .result-card>p{
        font-size:14px;
      }

      .result-info{
        padding:15px;
      }

      .result-row{
        flex-direction:column;
        gap:4px;
      }

      .result-row span{
        font-size:12px;
      }

      .result-row strong{
        text-align:left;
        font-size:14px;
      }

      .reason-box{
        font-size:14px;
      }

    }

  </style>

</head>

<body>

<div class="result-page">

<main class="card result-card">

<div class="result-icon">
✕
</div>

<h1>
請假申請已退回
</h1>

<p>
系統已將退回結果與主管說明通知申請人，
員工可修改資料後重新提出申請。
</p>

<section class="result-info">

<div class="result-row">
<span>申請人</span>
<strong>—</strong>
</div>

<div class="result-row">
<span>申請編號</span>
<strong>—</strong>
</div>

<div class="result-row">
<span>假別</span>
<strong>特休假</strong>
</div>

<div class="result-row">
<span>處理結果</span>

<strong class="reject-status">
已退回
</strong>

</div>

<div class="reason-box">

<strong>退回原因</strong>

<br><br>

當日部門人力不足，
請重新確認日期後再送出申請。

</div>

</section>

<div class="notice" style="margin-top:18px;">
退回後系統不會扣除員工假期，
重新送出時將重新進入主管審核流程。
</div>

<div class="actions result-actions">

<a
class="button primary"
href="leave-requests.html"
>
繼續審核下一筆
</a>

<a
class="button secondary"
href="approval-history.html"
>
查看審核紀錄
</a>

<a
class="button secondary"
href="index.html"
>
返回主管工作台
</a>

</div>

</main>

</div>

<nav
class="mobile-nav"
aria-label="主管手機導覽"
>

<a href="index.html">
<span>⌂</span>
<small>首頁</small>
</a>

<a
class="active"
href="leave-requests.html"
aria-current="page"
>
<span>✓</span>
<small>審核</small>
</a>

<a href="team.html">
<span>人</span>
<small>團隊</small>
</a>

<a href="notifications.html">
<span>•••</span>
<small>更多</small>
</a>

</nav>

  <script src="../assets/js/api.js?v=20260811-live43"></script><script src="../assets/js/manager-workflow-data.js?v=20260811-live43"></script>
</body>
</html>
