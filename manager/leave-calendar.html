<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>部門請假日曆｜智慧人資管理平台</title>

  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">

  <style>
    .calendar-page {
      width: min(1100px, calc(100% - 28px));
    }

    .calendar-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .month-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .month-button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #d8e2ec;
      border-radius: 11px;
      color: var(--color-text-soft);
      background: var(--color-surface);
      font-weight: 800;
    }

    .calendar-header h1 {
      margin: 0;
      font-size: 30px;
    }

    .calendar-header p {
      margin: 8px 0 0;
      color: var(--color-muted);
      line-height: 1.7;
    }

    .calendar-summary {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .calendar-card {
      margin-top: 20px;
      padding: 22px;
      overflow-x: auto;
      border: 1px solid var(--color-border);
      border-radius: 22px;
      background: var(--color-surface);
      box-shadow: var(--shadow-medium);
      -webkit-overflow-scrolling: touch;
    }

    .calendar-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .calendar-card-head h2 {
      margin: 0;
      font-size: 22px;
    }

    .calendar-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      font-size: 13px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 50%;
    }

    .legend-approved {
      background: var(--color-primary);
    }

    .legend-pending {
      background: #f59e0b;
    }

    .legend-late {
      background: #2563eb;
    }

    .calendar-grid {
      min-width: 840px;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border-top: 1px solid var(--color-border);
      border-left: 1px solid var(--color-border);
    }

    .calendar-weekday,
    .calendar-day {
      border-right: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
    }

    .calendar-weekday {
      padding: 12px 8px;
      color: #64748b;
      background: #f8fafc;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
    }

    .calendar-day {
      min-height: 125px;
      padding: 10px;
      background: var(--color-surface);
    }

    .calendar-day.muted {
      color: #a3adb9;
      background: #fafafa;
    }

    .calendar-day.today {
      box-shadow: inset 0 0 0 2px var(--color-primary);
    }

    .date-number {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 800;
    }

    .calendar-event {
      display: block;
      margin-top: 6px;
      padding: 7px 8px;
      border-radius: 9px;
      font-size: 12px;
      line-height: 1.4;
    }

    .calendar-event.approved {
      color: #065f46;
      background: var(--color-success-bg);
    }

    .calendar-event.pending {
      color: var(--color-warning);
      background: var(--color-warning-bg);
    }

    .calendar-event.late {
      color: #1d4ed8;
      background: #dbeafe;
    }

    .schedule-card {
      margin-top: 20px;
    }

    .schedule-card h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .schedule-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 15px 0;
      border-bottom: 1px solid #edf1f5;
    }

    .schedule-item:last-child {
      border-bottom: 0;
    }

    .schedule-item h3 {
      margin: 0;
      font-size: 15px;
    }

    .schedule-item p {
      margin: 6px 0 0;
      color: var(--color-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .schedule-status {
      display: inline-flex;
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .schedule-status.approved {
      color: var(--color-success);
      background: var(--color-success-bg);
    }

    .schedule-status.pending {
      color: var(--color-warning);
      background: var(--color-warning-bg);
    }

    .schedule-status.late {
      color: #1d4ed8;
      background: #dbeafe;
    }

    .mobile-schedule {
      display: none;
    }

    @media (max-width: 700px) {
      .calendar-page {
        width: calc(100% - 20px);
      }

      .calendar-topbar {
        align-items: stretch;
        flex-direction: column;
        margin-bottom: 14px;
      }

      .calendar-topbar .back {
        display: none;
      }

      .month-actions {
        width: 100%;
      }

      .month-button {
        flex: 1;
        min-width: 0;
        padding: 0 8px;
        font-size: 13px;
      }

      .calendar-header h1 {
        font-size: 24px;
      }

      .calendar-header p {
        font-size: 14px;
      }

      .calendar-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .calendar-summary .summary-card:last-child {
        grid-column: 1 / -1;
      }

      .calendar-card {
        padding: 16px;
        border-radius: 18px;
      }

      .calendar-card-head {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }

      .calendar-card-head h2 {
        font-size: 19px;
      }

      .calendar-legend {
        gap: 8px;
      }

      .legend-item {
        font-size: 11px;
      }

      .calendar-grid {
        display: none;
      }

      .mobile-schedule {
        display: grid;
        gap: 10px;
      }

      .mobile-day-card {
        padding: 14px;
        border: 1px solid var(--color-border);
        border-radius: 15px;
        background: #f8fafc;
      }

      .mobile-day-card.today {
        border-color: var(--color-primary);
        background: #f0fdfa;
      }

      .mobile-day-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .mobile-day-head strong {
        font-size: 15px;
      }

      .mobile-day-head span {
        color: var(--color-muted);
        font-size: 12px;
      }

      .mobile-day-card .calendar-event {
        margin-top: 7px;
      }

      .schedule-card {
        padding: 17px;
      }

      .schedule-card h2 {
        margin-bottom: 10px;
        font-size: 18px;
      }

      .schedule-item {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
        padding: 12px 0;
      }

      .schedule-item h3 {
        font-size: 14px;
      }

      .schedule-item p {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="page calendar-page">

    <div class="calendar-topbar">
      <a class="back" href="index.html">
        ← 返回主管工作台
      </a>

      <div class="month-actions">
        <a class="month-button" href="#">
          ← 上個月
        </a>

        <a class="month-button" href="#">
          今天
        </a>

        <a class="month-button" href="#">
          下個月 →
        </a>
      </div>
    </div>

    <header class="calendar-header">
      <h1>部門請假日曆</h1>

      <p>
        查看所屬部門員工的請假、待審核申請與晚到狀況。
      </p>
    </header>

    <section class="summary-grid calendar-summary">
      <article class="summary-card">
        <span>本月請假人次</span>
        <strong>0</strong>
      </article>

      <article class="summary-card">
        <span>待審核申請</span>
        <strong>0</strong>
      </article>

      <article class="summary-card">
        <span>今日不在辦公室</span>
        <strong>0</strong>
      </article>
    </section>

    <section class="calendar-card">

      <div class="calendar-card-head">
        <h2>日曆載入中</h2>

        <div class="calendar-legend">
          <span class="legend-item">
            <span class="legend-dot legend-approved"></span>
            已核准請假
          </span>

          <span class="legend-item">
            <span class="legend-dot legend-pending"></span>
            等待審核
          </span>

          <span class="legend-item">
            <span class="legend-dot legend-late"></span>
            晚到通知
          </span>
        </div>
      </div>

      <!-- 電腦版月曆 -->
      <div class="calendar-grid" id="calendarGrid">
        <div class="calendar-weekday">日</div><div class="calendar-weekday">一</div><div class="calendar-weekday">二</div><div class="calendar-weekday">三</div><div class="calendar-weekday">四</div><div class="calendar-weekday">五</div><div class="calendar-weekday">六</div>
      </div>

      <!-- 手機版重點行程 -->
      <div class="mobile-schedule" id="mobileSchedule"><p>資料載入中…</p></div>
    </section>

    <section class="card schedule-card" id="scheduleCard">
      <h2>近期人力安排</h2>

      <a
        class="schedule-item"
        href="leave-request-detail.html"
      >
        <div>
          <h3>—－特休假</h3>
          <p>— 至 —，共 2 天。</p>
        </div>

        <span class="schedule-status pending">
          等待審核
        </span>
      </a>

      <a
        class="schedule-item"
        href="team-member-detail.html"
      >
        <div>
          <h3>—－特休假</h3>
          <p>—，共 1 天。</p>
        </div>

        <span class="schedule-status approved">
          已核准
        </span>
      </a>

      <a
        class="schedule-item"
        href="late-notice-detail.html"
      >
        <div>
          <h3>—－晚到通知</h3>
          <p>—，預計上午 10:00 到班。</p>
        </div>

        <span class="schedule-status late">
          已通知
        </span>
      </a>
    </section>
  </main>

  <nav
    class="mobile-nav"
    aria-label="主管手機導覽"
  >
    <a href="index.html">
      <span>⌂</span>
      <small>首頁</small>
    </a>

    <a
      class="active"
      href="leave-requests.html"
    >
      <span>✓</span>
      <small>審核</small>
    </a>

    <a href="team.html">
      <span>人</span>
      <small>團隊</small>
    </a>

    <a href="notifications.html">
      <span>•••</span>
      <small>更多</small>
    </a>
  </nav>
  <script src="../assets/js/api.js?v=20260817-review2"></script>
  <script>
    (async () => {
      try {
        const [leavePayload, latePayload] = await Promise.all([apiRequest("/leave-requests/"), apiRequest("/late-notices/")]);
        const leaves = Array.isArray(leavePayload) ? leavePayload : (leavePayload.results || []);
        const lateNotices = Array.isArray(latePayload) ? latePayload : (latePayload.results || []);
        const now = new Date();
        const params = new URLSearchParams(location.search);
        const year = Number(params.get("year")) || now.getFullYear();
        const month = Math.min(11, Math.max(0, (Number(params.get("month")) || now.getMonth() + 1) - 1));
        document.querySelector(".calendar-card-head h2").textContent = `${year} 年 ${month + 1} 月`;
        const monthLinks = document.querySelectorAll(".calendar-topbar a[href='#']");
        const previous = new Date(year, month - 1, 1);
        const next = new Date(year, month + 1, 1);
        if (monthLinks[0]) monthLinks[0].href = `?year=${previous.getFullYear()}&month=${previous.getMonth() + 1}`;
        if (monthLinks[1]) monthLinks[1].href = `?year=${now.getFullYear()}&month=${now.getMonth() + 1}`;
        if (monthLinks[2]) monthLinks[2].href = `?year=${next.getFullYear()}&month=${next.getMonth() + 1}`;
        const calendarGrid = document.querySelector("#calendarGrid");
        calendarGrid.querySelectorAll(".calendar-day").forEach((node) => node.remove());
        const firstWeekday = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const previousMonthDays = new Date(year, month, 0).getDate();
        for (let index = 0; index < 42; index += 1) {
          const offset = index - firstWeekday + 1;
          const day = document.createElement("div");
          day.className = "calendar-day";
          let dayNumber = offset;
          if (offset < 1) { dayNumber = previousMonthDays + offset; day.classList.add("muted"); }
          if (offset > daysInMonth) { dayNumber = offset - daysInMonth; day.classList.add("muted"); }
          if (year === now.getFullYear() && month === now.getMonth() && dayNumber === now.getDate() && !day.classList.contains("muted")) day.classList.add("today");
          day.innerHTML = `<span class="date-number">${dayNumber}</span>`;
          calendarGrid.appendChild(day);
        }
        const events = [];
        leaves.forEach((item) => {
          const start = new Date(`${item.start_date}T00:00:00`);
          const end = new Date(`${item.end_date}T00:00:00`);
          for (let cursor = new Date(start); cursor <= end; cursor.setDate(cursor.getDate() + 1)) {
            if (cursor.getFullYear() === year && cursor.getMonth() === month) events.push({ date: cursor.getDate(), type: item.status, text: `${item.employee_name || "員工"}｜${item.leave_type}${item.status === "pending" ? "待審核" : ""}`, id: item.id });
          }
        });
        lateNotices.forEach((item) => { const date = new Date(`${item.late_date || item.date}T00:00:00`); if (date.getFullYear() === year && date.getMonth() === month) events.push({ date: date.getDate(), type: "late", text: `${item.employee_name || "員工"}｜預計 ${item.expected_arrival} 到班`, id: item.id }); });
        const monthStart = `${year}-${String(month + 1).padStart(2, "0")}-01`;
        const monthEnd = `${year}-${String(month + 1).padStart(2, "0")}-${String(daysInMonth).padStart(2, "0")}`;
        const monthLeaves = leaves.filter((item) => item.start_date <= monthEnd && item.end_date >= monthStart);
        const today = now.toISOString().slice(0, 10);
        const absentToday = new Set([
          ...leaves.filter((item) => item.status === "approved" && item.start_date <= today && item.end_date >= today).map((item) => item.employee),
          ...lateNotices.filter((item) => String(item.late_date || item.date).slice(0, 10) === today).map((item) => item.employee)
        ]).size;
        const summary = document.querySelectorAll(".calendar-summary .summary-card strong");
        if (summary[0]) summary[0].textContent = String(monthLeaves.length);
        if (summary[1]) summary[1].textContent = String(monthLeaves.filter((item) => item.status === "pending").length);
        if (summary[2]) summary[2].textContent = String(absentToday);
        document.querySelectorAll("#calendarGrid .calendar-event").forEach((node) => node.remove());
        events.forEach((event) => { const day = [...document.querySelectorAll("#calendarGrid .calendar-day")].find((node) => node.querySelector(".date-number")?.textContent.trim() === String(event.date) && !node.classList.contains("muted")); if (day) { const link = document.createElement("a"); link.className = `calendar-event ${event.type}`; link.href = event.type === "late" ? `late-notice-detail.html?id=${event.id}` : `leave-request-detail.html?id=${event.id}`; link.textContent = event.text; day.appendChild(link); } });
        const grouped = events.reduce((map, event) => { (map[event.date] ||= []).push(event); return map; }, {});
        document.querySelector("#mobileSchedule").innerHTML = Object.keys(grouped).sort((a, b) => Number(a) - Number(b)).map((date) => `<article class="mobile-day-card"><div class="mobile-day-head"><strong>${month + 1} 月 ${Number(date)} 日</strong><span>${grouped[date].length} 筆安排</span></div>${grouped[date].map((event) => `<a class="calendar-event ${event.type}" href="${event.type === "late" ? `late-notice-detail.html?id=${Number(event.id)}` : `leave-request-detail.html?id=${Number(event.id)}`}">${hrEscapeHtml(event.text)}</a>`).join("")}</article>`).join("") || "<p>目前沒有部門請假或晚到安排。</p>";
        const schedule = document.querySelector("#scheduleCard");
        const heading = schedule.querySelector("h2");
        schedule.innerHTML = ""; if (heading) schedule.appendChild(heading);
        schedule.insertAdjacentHTML("beforeend", events.slice(0, 5).map((event) => `<a class="schedule-item" href="${event.type === "late" ? `late-notice-detail.html?id=${Number(event.id)}` : `leave-request-detail.html?id=${Number(event.id)}`}"><div><h3>${hrEscapeHtml(event.text)}</h3><p>${year}/${String(month + 1).padStart(2, "0")}/${String(Number(event.date)).padStart(2, "0")}</p></div><span class="schedule-status ${event.type}">${event.type === "pending" ? "等待審核" : event.type === "approved" ? "已核准" : "已通知"}</span></a>`).join("") || "<p>目前沒有近期人力安排。</p>");
      } catch (error) { console.error("Calendar data load failed", error); }
    })();
  </script>
</body>
</html>
