<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入｜智慧人資管理平台</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    body { min-height:100vh; background:#f3f6fa; }
    .login-shell { width:min(1040px,calc(100% - 32px)); min-height:100vh; display:grid; grid-template-columns:minmax(0,1fr) 430px; align-items:center; gap:72px; margin:0 auto; padding:48px 0; }
    .login-intro .brand { margin-bottom:34px; }
    .login-intro h1 { max-width:560px; margin:0; font-size:clamp(34px,5vw,54px) !important; line-height:1.15; }
    .login-intro > p { max-width:540px; margin:18px 0 0; color:#5f7188; font-size:17px; line-height:1.8; }
    .login-points { display:grid; gap:13px; margin:30px 0 0; padding:0; list-style:none; }
    .login-points li { display:flex; align-items:center; gap:11px; color:#304963; }
    .login-points li::before { content:"✓"; display:grid; width:25px; height:25px; place-items:center; border-radius:50%; color:#087f73; background:#dff7f2; font-weight:800; }
    .login-card { padding:30px; border:1px solid #dce5ef; background:#fff; box-shadow:0 18px 46px rgba(24,59,99,.1); }
    .login-card h2 { margin:0 0 7px; font-size:25px; }
    .login-card > p { margin:0 0 24px; color:#64748b; }
    .login-field { margin-bottom:17px; }
    .login-field label { display:block; margin-bottom:7px; color:#233d5b; font-weight:700; }
    .password-wrap { position:relative; }
    .password-wrap input { padding-right:76px; }
    .password-toggle { position:absolute; right:8px; top:50%; min-height:34px; padding:0 10px; border:0; transform:translateY(-50%); color:#36516f; background:#edf2f7; font-size:13px; }
    .login-submit { width:100%; min-height:50px; margin-top:5px; color:#fff; background:#183b63; }
    .login-submit:disabled { cursor:wait; opacity:.65; }
    .login-error { display:none; margin-bottom:17px; padding:12px 14px; border:1px solid #f2b9bd; color:#b4232e; background:#fff0f1; }
    .company-login { display:block; margin-top:14px; padding:13px; text-align:center; color:#183b63; background:#edf3f8; font-weight:700; }
    .login-note { margin-top:18px !important; text-align:center; font-size:13px; }
    .mobile-brand { display:none; margin-bottom:26px; text-align:center; }
    .mobile-brand .brand-mark { margin:0 auto 12px; }
    .mobile-brand strong { display:block; font-size:22px; }
    @media (max-width:780px) {
      .login-shell { width:min(100% - 22px,460px); display:block; padding:28px 0; }
      .login-intro { display:none; }
      .mobile-brand { display:block; }
      .login-card { padding:22px; }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-intro" aria-label="系統介紹">
      <div class="brand"><span class="brand-mark">兆</span><div><strong>智慧人資管理平台</strong><small>Smart HR Management</small></div></div>
      <h1>登入後，直接完成你被授權的工作</h1>
      <p>系統會依帳號權限自動進入員工、主管或系統管理者工作台，不需要自行選擇角色。</p>
      <ul class="login-points">
        <li>員工：請假、晚到通知與個人資料</li>
        <li>主管：申請審核、團隊與部門資訊</li>
        <li>管理者：員工、帳號、部門與系統設定</li>
      </ul>
    </section>
    <section>
      <header class="mobile-brand"><div class="brand-mark">兆</div><strong>智慧人資管理平台</strong></header>
      <form class="login-card card" id="loginForm">
        <h2>登入系統</h2>
        <p>請使用公司提供的帳號與密碼。</p>
        <div class="login-error" id="loginError" role="alert"></div>
        <div class="login-field"><label for="username">帳號</label><input id="username" name="username" autocomplete="username" required autofocus></div>
        <div class="login-field">
          <label for="password">密碼</label>
          <div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" aria-label="顯示密碼">顯示</button></div>
        </div>
        <button class="button login-submit" type="submit">登入</button>
        <a class="company-login" href="central-login.html">公司統一登入</a>
        <p class="login-note">登入後會依帳號權限自動開啟可使用的功能。</p>
      </form>
    </section>
  </main>
  <script src="assets/js/api.js?v=20260819-home-login1"></script>
  <script>
    const form = document.querySelector("#loginForm");
    const errorBox = document.querySelector("#loginError");
    const params = new URLSearchParams(window.location.search);
    const rolePaths = { employee: "employee/index.html", manager: "manager/index.html", admin: "admin/index.html" };
    const redirectUser = (user) => {
      const rolePath = rolePaths[user.role] || "index.html";
      const next = params.get("next");
      window.location.replace(next && next.startsWith(rolePath) ? next : rolePath);
    };
    document.querySelector(".password-toggle").addEventListener("click", (event) => {
      const showing = form.password.type === "text";
      form.password.type = showing ? "password" : "text";
      event.currentTarget.textContent = showing ? "顯示" : "隱藏";
      event.currentTarget.setAttribute("aria-label", showing ? "顯示密碼" : "隱藏密碼");
    });
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.style.display = "none";
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      button.textContent = "登入中…";
      try { redirectUser(await login(form.username.value.trim(), form.password.value)); }
      catch (error) {
        errorBox.textContent = error.message || "登入失敗，請稍後再試。";
        errorBox.style.display = "block";
        button.disabled = false;
        button.textContent = "登入";
      }
    });
    (async () => {
      if (!localStorage.getItem("hr_token")) return;
      try { redirectUser(await getCurrentUser()); }
      catch { /* apiRequest 會清除無效登入狀態。 */ }
    })();
  </script>
</body>
</html>
