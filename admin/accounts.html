<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帳號與權限｜智慧人資管理平台</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(1080px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .back {
      color: #4338ca;
      font-weight: 800;
    }

    .add-button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 12px;
      color: white;
      background: #4338ca;
      font-weight: 800;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      color: #718096;
      line-height: 1.7;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 22px;
    }

    .summary-card {
      padding: 20px;
      border: 1px solid #e5ebf2;
      border-radius: 18px;
      background: white;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .summary-card.selected {
      border-color: #4338ca;
      box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.16), 0 12px 30px rgba(67, 56, 202, 0.12);
      transform: translateY(-2px);
    }

    .summary-card span {
      color: #718096;
      font-size: 14px;
    }

    .summary-card strong {
      display: block;
      margin-top: 8px;
      font-size: 27px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      padding: 18px;
      border: 1px solid #e5ebf2;
      border-radius: 18px;
      background: white;
    }

    input,
    select {
      min-height: 42px;
      padding: 0 13px;
      border: 1px solid #d8e2ec;
      border-radius: 11px;
      background: white;
      color: #18212f;
      font: inherit;
      outline: none;
    }

    input {
      flex: 1;
    }

    input:focus,
    select:focus {
      border-color: #4338ca;
      box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.1);
    }

    .account-list {
      display: grid;
      gap: 16px;
      margin-top: 18px;
    }

    .account-card {
      display: block;
      padding: 22px;
      border: 1px solid #e5ebf2;
      border-radius: 20px;
      background: white;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .account-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 34px rgba(15, 23, 42, 0.08);
    }

    .account-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .account-main {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      color: white;
      background: #4338ca;
      font-size: 19px;
      font-weight: 800;
    }

    .account-main h2 {
      margin: 0;
      font-size: 19px;
    }

    .account-main p {
      margin: 6px 0 0;
      color: #718096;
      font-size: 13px;
    }

    .status {
      display: inline-flex;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .active {
      color: #047857;
      background: #d1fae5;
    }

    .pending {
      color: #92400e;
      background: #fef3c7;
    }

    .disabled {
      color: #b91c1c;
      background: #fee2e2;
    }

    .account-info {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #edf1f5;
    }

    .info-item span {
      display: block;
      margin-bottom: 6px;
      color: #718096;
      font-size: 13px;
    }

    .info-item strong {
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .role-tag {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 999px;
      color: #4338ca;
      background: #eef2ff;
      font-size: 12px;
      font-weight: 800;
    }

    .view-link {
      display: inline-flex;
      margin-top: 18px;
      color: #4338ca;
      font-weight: 800;
    }

    @media (max-width: 800px) {
      .summary-grid,
      .account-info {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 620px) {
      .topbar,
      .toolbar,
      .account-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .summary-grid,
      .account-info {
        grid-template-columns: 1fr;
      }

      input,
      select,
      .add-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="topbar">
      <a class="back" href="index.html">← 返回管理工作台</a>
      <a class="add-button" href="account-create.html">＋ 建立帳號</a>
    </div>

    <header class="header">
      <h1>帳號與權限</h1>
      <p>管理使用者登入帳號、系統角色與帳號啟用狀態。</p>
    </header>

    <section class="summary-grid">
      <a class="summary-card selected" data-filter="all" href="?filter=all">
        <span>全部帳號</span>
        <strong>0</strong>
      </a>

      <a class="summary-card" data-filter="active" href="?filter=active">
        <span>已啟用</span>
        <strong>0</strong>
      </a>

      <a class="summary-card" data-filter="pending" href="?filter=pending">
        <span>等待啟用</span>
        <strong>0</strong>
      </a>

      <a class="summary-card" data-filter="inactive" href="?filter=inactive">
        <span>已停用</span>
        <strong>0</strong>
      </a>
    </section>

    <section class="toolbar">
      <input type="search" placeholder="搜尋姓名、帳號或電子郵件">

      <select>
        <option>全部角色</option>
        <option>Employee</option>
        <option>Manager</option>
        <option>Admin</option>
      </select>

      <select>
        <option>全部狀態</option>
        <option>已啟用</option>
        <option>等待啟用</option>
        <option>已停用</option>
      </select>
    </section>

    <section class="account-list" id="accountList">
      <p class="empty-state">資料載入中…</p>
    </section>
  </main>
</body>
  <script src="../assets/js/api.js?v=20260811-live44"></script>
  <script>
    (async () => {
      try {
        const payload = await apiRequest("/employees/");
        const users = Array.isArray(payload) ? payload : (payload.results || []);
        const counts = document.querySelectorAll(".summary-grid .summary-card strong");
        const active = users.filter((user) => user.is_active);
        if (counts[0]) counts[0].textContent = String(users.length);
        if (counts[1]) counts[1].textContent = String(active.length);
        if (counts[2]) counts[2].textContent = "0";
        if (counts[3]) counts[3].textContent = String(users.length - active.length);
        const search = document.querySelector('input[type="search"]');
        const selects = document.querySelectorAll(".toolbar select");
        const list = document.querySelector("#accountList");
        let activeFilter = new URLSearchParams(window.location.search).get("filter") || "all";
        const render = () => {
          const keyword = (search?.value || "").trim().toLowerCase();
          const role = selects[0]?.value || "全部角色";
          const status = selects[1]?.value || "全部狀態";
          const filtered = users.filter((user) => {
            const text = `${user.display_name || ""} ${user.username || ""} ${user.email || ""} ${user.employee_no || ""}`.toLowerCase();
            const roleMatch = role === "全部角色" || user.role_label === role || user.role === role.toLowerCase();
            const statusMatch = status === "全部狀態" || (status === "已啟用" && user.is_active) || (status === "已停用" && !user.is_active);
            const filterMatch = activeFilter === "all" || (activeFilter === "active" && user.is_active) || (activeFilter === "inactive" && !user.is_active) || activeFilter === "pending" && false;
            return text.includes(keyword) && roleMatch && statusMatch && filterMatch;
          });
          list.innerHTML = filtered.map((user) => `<a class="account-card" href="account-detail.html?id=${user.id}"><div class="account-head"><div class="account-main"><div class="avatar">${(user.display_name || user.username || "員").slice(0, 1)}</div><div><h2>${user.display_name || user.username}</h2><p>登入帳號：${user.username}｜${user.employee_no || "—"}</p></div></div><span class="status ${user.is_active ? "active" : "disabled"}">${user.is_active ? "已啟用" : "已停用"}</span></div><div class="account-info"><div class="info-item"><span>系統角色</span><strong><span class="role-tag">${user.role_label}</span></strong></div><div class="info-item"><span>所屬部門</span><strong>${user.department_name || "—"}</strong></div><div class="info-item"><span>電子郵件</span><strong>${user.email || "—"}</strong></div></div><span class="view-link">查看與設定帳號權限 →</span></a>`).join("") || `<p>${activeFilter === "pending" ? "目前沒有等待啟用的帳號。" : "目前沒有符合條件的帳號。"}</p>`;
        };
        document.querySelectorAll(".summary-card[data-filter]").forEach((card) => card.addEventListener("click", () => { activeFilter = card.dataset.filter; document.querySelectorAll(".summary-card[data-filter]").forEach((item) => item.classList.toggle("selected", item === card)); render(); }));
        document.querySelectorAll(".summary-card[data-filter]").forEach((card) => card.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); card.click(); } }));
        [search, ...selects].filter(Boolean).forEach((element) => element.addEventListener("input", render));
        document.querySelectorAll(".summary-card[data-filter]").forEach((item) => item.classList.toggle("selected", item.dataset.filter === activeFilter));
        render();
      } catch (error) { document.querySelector("#accountList").innerHTML = `<p>${error.message || "無法載入帳號資料。"}</p>`; }
    })();
  </script>
</html>
