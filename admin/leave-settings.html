<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>假別與規則｜智慧人資管理平台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(1080px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .back {
      color: #4338ca;
      font-weight: 800;
    }

    .add-button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 12px;
      color: white;
      background: #4338ca;
      font-weight: 800;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      color: #718096;
      line-height: 1.7;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 22px;
    }

    .summary-card {
      padding: 20px;
      border: 1px solid #e5ebf2;
      border-radius: 18px;
      background: white;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
    }

    .summary-card span {
      color: #718096;
      font-size: 14px;
    }

    .summary-card strong {
      display: block;
      margin-top: 8px;
      font-size: 27px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      padding: 18px;
      border: 1px solid #e5ebf2;
      border-radius: 18px;
      background: white;
    }

    input,
    select {
      min-height: 42px;
      padding: 0 13px;
      border: 1px solid #d8e2ec;
      border-radius: 11px;
      background: white;
      color: #18212f;
      font: inherit;
      outline: none;
    }

    input {
      flex: 1;
    }

    input:focus,
    select:focus {
      border-color: #4338ca;
      box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.1);
    }

    .leave-list {
      display: grid;
      gap: 16px;
      margin-top: 18px;
    }

    .leave-card {
      padding: 22px;
      border: 1px solid #e5ebf2;
      border-radius: 20px;
      background: white;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
    }

    .leave-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
    }

    .leave-main {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 15px;
      background: #eef2ff;
      font-size: 24px;
    }

    .leave-main h2 {
      margin: 0;
      font-size: 20px;
    }

    .leave-main p {
      margin: 6px 0 0;
      color: #718096;
      font-size: 13px;
    }

    .status {
      display: inline-flex;
      flex: 0 0 auto;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .active {
      color: #047857;
      background: #d1fae5;
    }

    .inactive {
      color: #b91c1c;
      background: #fee2e2;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #edf1f5;
    }

    .detail span {
      display: block;
      margin-bottom: 6px;
      color: #718096;
      font-size: 12px;
    }

    .detail strong {
      font-size: 14px;
      line-height: 1.6;
    }

    .rule-box {
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: #f8fafc;
      color: #475569;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 800;
    }

    .primary {
      color: white;
      background: #4338ca;
    }

    .secondary {
      color: #475569;
      background: white;
      border: 1px solid #d8e2ec;
    }

    .danger {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .notice {
      margin-top: 20px;
      padding: 16px 18px;
      border-left: 4px solid #4338ca;
      border-radius: 12px;
      background: #eef2ff;
      color: #475569;
      line-height: 1.7;
    }

    @media (max-width: 850px) {
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .details {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      .topbar,
      .toolbar,
      .leave-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .summary-grid,
      .details {
        grid-template-columns: 1fr;
      }

      input,
      select,
      .add-button {
        width: 100%;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="topbar">
      <a class="back" href="index.html">← 返回管理工作台</a>
      <a class="add-button" href="leave-type-create.html">＋ 新增假別</a>
    </div>

    <header class="header">
      <h1>假別與規則</h1>
      <p>管理公司假別、年度額度、附件需求與請假計算方式。</p>
    </header>

    <section class="summary-grid">
      <article class="summary-card">
        <span>全部假別</span>
        <strong>0</strong>
      </article>

      <article class="summary-card">
        <span>啟用中</span>
        <strong>0</strong>
      </article>

      <article class="summary-card">
        <span>需上傳附件</span>
        <strong>0</strong>
      </article>

      <article class="summary-card">
        <span>需扣除額度</span>
        <strong>0</strong>
      </article>
    </section>

    <section class="toolbar">
      <input type="search" placeholder="搜尋假別名稱或說明">

      <select>
        <option>全部狀態</option>
        <option>啟用中</option>
        <option>已停用</option>
      </select>

      <select>
        <option>全部計薪方式</option>
        <option>有薪</option>
        <option>無薪</option>
        <option>部分給薪</option>
      </select>
    </section>

    <section class="leave-list">
      <p class="empty-state">資料載入中…</p>
    </section>

    <div class="notice">
      修改假別規則後，只影響之後送出的申請；已完成審核的歷史資料不會被重新計算。
    </div>
  </main>
  <script src="../assets/js/api.js?v=20260811-live46"></script>
  <script src="../assets/js/admin-settings-data.js?v=20260811-live46"></script>
</body>
</html>
