<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重設帳號密碼｜智慧人資管理平台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .back {
      display: inline-flex;
      margin-bottom: 22px;
      color: #4338ca;
      font-weight: 800;
    }

    .card {
      padding: 28px;
      border: 1px solid #e5ebf2;
      border-radius: 24px;
      background: white;
      box-shadow: 0 14px 38px rgba(15, 23, 42, 0.07);
    }

    .header {
      padding: 18px;
      border-left: 5px solid #4338ca;
      border-radius: 14px;
      background: #eef2ff;
    }

    .header h1 {
      margin: 0 0 8px;
      color: #3730a3;
      font-size: 26px;
    }

    .header p {
      margin: 0;
      color: #5f6f82;
      line-height: 1.7;
    }

    .info-box {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #f8fafc;
    }

    .row {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid #e8edf2;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row span {
      color: #718096;
      font-size: 14px;
    }

    .row strong {
      line-height: 1.7;
    }

    .option-box {
      margin-top: 22px;
      padding: 18px;
      border: 1px solid #d8e2ec;
      border-radius: 16px;
    }

    .option-title {
      margin-bottom: 14px;
      font-weight: 800;
    }

    .radio-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 14px;
      border: 1px solid #e5ebf2;
      border-radius: 12px;
      cursor: pointer;
    }

    .radio-item + .radio-item {
      margin-top: 12px;
    }

    .radio-item input {
      margin-top: 4px;
    }

    .radio-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .radio-item p {
      margin: 0;
      color: #718096;
      line-height: 1.6;
      font-size: 14px;
    }

    .notice {
      margin-top: 22px;
      padding: 16px 18px;
      border-left: 4px solid #f59e0b;
      border-radius: 12px;
      background: #fffbeb;
      color: #6b5b34;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 26px;
    }

    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 800;
    }

    .primary {
      color: white;
      background: #4338ca;
    }

    .secondary {
      color: #475569;
      background: white;
      border: 1px solid #d8e2ec;
    }

    input[type="password"] {
      width: 100%;
      min-height: 46px;
      margin-top: 10px;
      padding: 0 13px;
      border: 1px solid #d8e2ec;
      border-radius: 12px;
      font: inherit;
    }

    @media (max-width: 620px) {
      .card {
        padding: 22px 18px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="back" href="account-detail.html">← 返回帳號詳情</a>

    <section class="card">
      <div class="header">
        <h1>重設帳號密碼</h1>
        <p>
          系統將使目前密碼失效，並通知使用者重新設定登入密碼。
        </p>
      </div>

      <section class="info-box">
        <div class="row">
          <span>使用者</span>
          <strong id="resetName">—</strong>
        </div>

        <div class="row">
          <span>登入帳號</span>
          <strong id="resetUsername">—</strong>
        </div>

        <div class="row">
          <span>電子信箱</span>
          <strong id="resetEmail">—</strong>
        </div>

        <div class="row">
          <span>系統角色</span>
          <strong id="resetRole">—</strong>
        </div>

        <div class="row">
          <span>帳號狀態</span>
          <strong id="resetStatus">—</strong>
        </div>
      </section>

      <section class="option-box">
        <div class="option-title">設定新密碼</div>
        <label for="newPassword">新密碼</label>
        <input id="newPassword" type="password" minlength="8" placeholder="至少 8 個字元" required>
      </section>

      <div class="notice">
        密碼重設完成後，使用者目前已登入的工作階段可能會被強制登出。
      </div>

      <div class="actions">
        <button class="button primary" id="resetButton" type="submit">確認重設密碼</button>

        <a class="button secondary" id="cancelReset" href="account-detail.html">
          取消
        </a>
      </div>
    </section>
  </main>
  <script src="../assets/js/api.js?v=20260811-live47"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) return;
      try {
        const user = await apiRequest(`/accounts/${id}/`);
        document.querySelector("#resetName").textContent = user.display_name || user.username;
        document.querySelector("#resetUsername").textContent = user.username;
        document.querySelector("#resetEmail").textContent = user.email || "—";
        document.querySelector("#resetRole").textContent = user.role_label;
        document.querySelector("#resetStatus").textContent = user.is_active ? "已啟用" : "已停用";
        document.querySelector("#cancelReset").href = `account-detail.html?id=${id}`;
        document.querySelector("#resetForm")?.removeAttribute("action");
        document.querySelector("#resetButton").addEventListener("click", async (event) => {
          event.preventDefault();
          const button = event.currentTarget;
          button.disabled = true;
          try {
            await apiRequest(`/accounts/${id}/`, { method: "PATCH", body: JSON.stringify({ password: document.querySelector("#newPassword").value }) });
            window.location.href = `account-reset-password-success.html?id=${id}`;
          } catch (error) { alert(error.message || "密碼重設失敗。"); button.disabled = false; }
        });
      } catch (error) { alert(error.message || "無法載入帳號資料。"); }
    })();
  </script>
</body>
</html>
