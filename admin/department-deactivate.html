<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>停用部門｜智慧人資管理平台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .back {
      display: inline-flex;
      margin-bottom: 22px;
      color: #4338ca;
      font-weight: 800;
    }

    .card {
      padding: 28px;
      border: 1px solid #e5ebf2;
      border-radius: 24px;
      background: white;
      box-shadow: 0 14px 38px rgba(15, 23, 42, 0.07);
    }

    .warning {
      display: flex;
      gap: 14px;
      padding: 18px;
      border-left: 5px solid #dc2626;
      border-radius: 14px;
      background: #fef2f2;
    }

    .warning-icon {
      font-size: 30px;
    }

    .warning h1 {
      margin: 0 0 8px;
      color: #991b1b;
      font-size: 26px;
    }

    .warning p {
      margin: 0;
      color: #5f6f82;
      line-height: 1.7;
    }

    .info-box {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #f8fafc;
    }

    .row {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid #e8edf2;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row span {
      color: #718096;
      font-size: 14px;
    }

    .row strong {
      line-height: 1.7;
    }

    .form-group {
      margin-top: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 800;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 13px 14px;
      border: 1px solid #d8e2ec;
      border-radius: 12px;
      color: #18212f;
      font: inherit;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #4338ca;
      box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.1);
    }

    .notice {
      margin-top: 22px;
      padding: 16px 18px;
      border-left: 4px solid #f59e0b;
      border-radius: 12px;
      background: #fffbeb;
      color: #6b5b34;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 26px;
    }

    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 800;
    }

    .danger {
      color: white;
      background: #b91c1c;
    }

    .secondary {
      color: #475569;
      background: white;
      border: 1px solid #d8e2ec;
    }

    @media (max-width: 620px) {
      .card {
        padding: 22px 18px;
      }

      .warning,
      .actions {
        flex-direction: column;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="back" href="department-detail.html">← 返回部門詳情</a>

    <section class="card">
      <div class="warning">
        <div class="warning-icon">⚠️</div>

        <div>
          <h1>確認停用這個部門？</h1>
          <p>
            停用後，此部門將無法再被指派給新進員工，
            但既有員工與歷史資料仍會保留。
          </p>
        </div>
      </div>

      <section class="info-box">
        <div class="row">
          <span>部門名稱</span>
          <strong id="deactivateDepartmentName">—</strong>
        </div>

        <div class="row">
          <span>部門代碼</span>
          <strong id="deactivateDepartmentCode">—</strong>
        </div>

        <div class="row">
          <span>部門主管</span>
          <strong id="deactivateDepartmentManager">—</strong>
        </div>

        <div class="row">
          <span>目前人數</span>
          <strong id="deactivateDepartmentCount">—</strong>
        </div>

        <div class="row">
          <span>目前狀態</span>
          <strong id="deactivateDepartmentStatus">—</strong>
        </div>
      </section>

      <div class="form-group">
        <label for="reason">停用原因</label>

        <textarea
          id="reason"
          placeholder="請說明停用原因，例如：組織調整、部門整併或業務終止"
          required
        ></textarea>
      </div>

      <div class="notice">
        部門內仍有員工時，建議先將員工轉移至其他部門，再執行停用。
      </div>

      <div class="actions">
        <a class="button danger" id="confirmDepartmentDeactivate" href="#">
          確認停用部門
        </a>

        <a class="button secondary" id="cancelDepartmentDeactivate" href="departments.html">
          取消
        </a>
      </div>
    </section>
  </main>
  <script src="../assets/js/api.js?v=20260811-live44"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) return;
      const set = (selector, value) => { const element = document.querySelector(selector); if (element) element.textContent = value || "—"; };
      try {
        const [department, employeePayload] = await Promise.all([apiRequest(`/departments/${id}/`), apiRequest("/employees/")]);
        const employees = Array.isArray(employeePayload) ? employeePayload : (employeePayload.results || []);
        const members = employees.filter((user) => user.department === department.id && user.is_active);
        const manager = members.find((user) => user.role === "manager");
        set("#deactivateDepartmentName", department.name); set("#deactivateDepartmentCode", department.code); set("#deactivateDepartmentManager", manager?.display_name); set("#deactivateDepartmentCount", `${members.length} 人`); set("#deactivateDepartmentStatus", department.is_active ? "啟用中" : "已停用");
        document.querySelector("#cancelDepartmentDeactivate").href = `department-detail.html?id=${id}`;
        document.querySelector("#confirmDepartmentDeactivate").addEventListener("click", async (event) => { event.preventDefault(); try { await apiRequest(`/departments/${id}/`, { method: "PATCH", body: JSON.stringify({ is_active: false }) }); window.location.href = `department-deactivate-success.html?id=${id}`; } catch (error) { alert(error.message || "停用部門失敗。"); } });
      } catch (error) { set("#deactivateDepartmentName", `無法載入部門：${error.message}`); }
    })();
  </script>
</body>
</html>
