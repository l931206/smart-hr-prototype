<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系統操作紀錄｜智慧人資管理平台</title>

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    font-family:Arial,"Noto Sans TC",sans-serif;
    background:#f4f7fb;
    color:#18212f;
}

a{
    color:inherit;
    text-decoration:none;
}

.page{
    width:min(1100px,calc(100% - 28px));
    margin:auto;
    padding:28px 0 48px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    margin-bottom:22px;
}

.back{
    color:#4338ca;
    font-weight:800;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin:8px 0 0;
    color:#718096;
}

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-top:22px;
}

.card{
    background:white;
    border:1px solid #e5ebf2;
    border-radius:18px;
    padding:20px;
    box-shadow:0 10px 28px rgba(15,23,42,.05);
}

.card span{
    color:#718096;
    font-size:14px;
}

.card strong{
    display:block;
    margin-top:8px;
    font-size:28px;
}

.toolbar{
    display:flex;
    gap:12px;
    margin-top:18px;
    padding:18px;
    border:1px solid #e5ebf2;
    border-radius:18px;
    background:white;
}

input,
select{
    min-height:42px;
    padding:0 13px;
    border:1px solid #d8e2ec;
    border-radius:11px;
    font:inherit;
}

input{
    flex:1;
}

.log-list{
    display:grid;
    gap:16px;
    margin-top:20px;
}

.log{
    background:white;
    border:1px solid #e5ebf2;
    border-radius:18px;
    padding:20px;
    box-shadow:0 10px 28px rgba(15,23,42,.05);
}

.log-head{
    display:flex;
    justify-content:space-between;
    gap:16px;
}

.log-head h2{
    margin:0;
    font-size:18px;
}

.time{
    color:#718096;
    font-size:13px;
}

.detail{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid #edf1f5;
}

.item span{
    display:block;
    color:#718096;
    font-size:12px;
}

.item strong{
    display:block;
    margin-top:6px;
}

.desc{
    margin-top:16px;
    padding:14px;
    background:#f8fafc;
    border-radius:12px;
    line-height:1.7;
    color:#475569;
}

.tag{
    display:inline-flex;
    margin-top:14px;
    padding:5px 10px;
    border-radius:999px;
    background:#eef2ff;
    color:#4338ca;
    font-size:12px;
    font-weight:800;
}

@media(max-width:760px){

.summary,
.detail{
grid-template-columns:1fr;
}

.toolbar,
.log-head{
flex-direction:column;
}

input,
select{
width:100%;
}

}
</style>

</head>

<body>

<main class="page">

<div class="topbar">
<a class="back" href="index.html">
← 返回管理工作台
</a>
</div>

<header class="header">
<h1>系統操作紀錄</h1>
<p>記錄所有重要的人資系統操作。</p>
</header>

<section class="summary">

<div class="card">
<span>今日操作</span>
<strong>0</strong>
</div>

<div class="card">
<span>本月操作</span>
<strong>0</strong>
</div>

<div class="card">
<span>操作人數</span>
<strong>0</strong>
</div>

<div class="card">
<span>異常事件</span>
<strong>0</strong>
</div>

</section>

<section class="toolbar">

<input type="search" placeholder="搜尋操作人、員工或關鍵字">

<select>
<option>全部操作</option>
<option>新增</option>
<option>修改</option>
<option>刪除</option>
<option>登入</option>
</select>

<select>
<option>今天</option>
<option>最近7天</option>
<option>本月</option>
</select>

</section>

<section class="log-list">
      <p class="empty-state">資料載入中…</p>
    </section>

</main>

  <script src="../assets/js/api.js?v=20260811-live44"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
      const list = document.querySelector(".log-list");
      try {
        const payload = await apiRequest("/audit-logs/");
        const logs = Array.isArray(payload) ? payload : (payload.results || []);
        const search = document.querySelector("input[type=search]");
        const filters = document.querySelectorAll("select");
        const now = new Date();
        const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        const summaries = document.querySelectorAll(".summary strong");
        if (summaries[0]) summaries[0].textContent = String(logs.filter((item) => new Date(item.created_at) >= startToday).length);
        if (summaries[1]) summaries[1].textContent = String(logs.filter((item) => new Date(item.created_at) >= startMonth).length);
        if (summaries[2]) summaries[2].textContent = String(new Set(logs.map((item) => item.actor).filter(Boolean)).size);
        if (summaries[3]) summaries[3].textContent = "0";
        const render = () => {
          const keyword = search.value.trim().toLowerCase();
          const action = filters[0].value;
          const range = filters[1].value;
          const threshold = new Date();
          if (range === "今天") threshold.setHours(0,0,0,0);
          if (range === "最近7天") threshold.setDate(threshold.getDate() - 7);
          if (range === "本月") { threshold.setDate(1); threshold.setHours(0,0,0,0); }
          const items = logs.filter((item) => {
            const text = `${item.actor_name} ${item.action} ${item.target_type} ${item.target_label}`.toLowerCase();
            const actionMatch = action === "全部操作" || item.action.includes(action === "修改" ? "更新" : action);
            return text.includes(keyword) && actionMatch && new Date(item.created_at) >= threshold;
          });
          list.innerHTML = items.length ? items.map((item) => `<article class="log"><div class="log-head"><h2>${escapeHtml(item.action)} ${escapeHtml(item.target_type)}</h2><time class="time">${new Date(item.created_at).toLocaleString("zh-TW")}</time></div><div class="detail"><div class="item"><span>操作人</span><strong>${escapeHtml(item.actor_name)}</strong></div><div class="item"><span>目標資料</span><strong>${escapeHtml(item.target_label || "—")}</strong></div><div class="item"><span>資料編號</span><strong>${escapeHtml(item.target_id || "—")}</strong></div><div class="item"><span>IP 位址</span><strong>${escapeHtml(item.ip_address || "—")}</strong></div></div><span class="tag">${escapeHtml(item.action)}</span></article>`).join("") : "<p>目前沒有符合條件的系統操作紀錄。</p>";
        };
        search.addEventListener("input", render);
        filters.forEach((filter) => filter.addEventListener("change", render));
        render();
      } catch (error) {
        list.innerHTML = `<p>無法載入操作紀錄：${escapeHtml(error.message)}</p>`;
      }
    });
  </script>
</body>
</html>
