<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>員工資料已更新｜智慧人資管理平台</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      text-decoration: none;
    }

    .success-card {
      width: min(560px, 100%);
      padding: 38px 30px;
      border: 1px solid #e5ebf2;
      border-radius: 28px;
      background: white;
      text-align: center;
      box-shadow: 0 20px 52px rgba(15, 23, 42, 0.1);
    }

    .success-icon {
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      color: white;
      background: #4338ca;
      font-size: 38px;
      box-shadow: 0 14px 30px rgba(67, 56, 202, 0.24);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    p {
      margin: 14px auto 0;
      max-width: 430px;
      color: #718096;
      line-height: 1.75;
    }

    .update-info {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #eef2ff;
      text-align: left;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 8px 0;
    }

    .info-row span {
      color: #718096;
      font-size: 14px;
    }

    .info-row strong {
      color: #4338ca;
      text-align: right;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: #d1fae5;
      color: #047857;
      font-size: 13px;
      font-weight: 800;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 800;
    }

    .primary {
      color: white;
      background: #4338ca;
    }

    .secondary {
      color: #475569;
      background: white;
      border: 1px solid #d8e2ec;
    }

    @media (max-width: 520px) {
      .success-card {
        padding: 32px 20px;
      }

      .info-row {
        flex-direction: column;
        gap: 4px;
      }

      .info-row strong {
        text-align: left;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="success-card">
    <div class="success-icon">✓</div>

    <h1>員工資料已更新</h1>

    <p>
      系統已儲存員工的最新資料，
      並同步更新部門、主管與相關權限設定。
    </p>

    <section class="update-info">
      <div class="info-row">
        <span>員工姓名</span>
        <strong id="updatedEmployeeName">—</strong>
      </div>

      <div class="info-row">
        <span>員工編號</span>
        <strong id="updatedEmployeeNo">—</strong>
      </div>

      <div class="info-row">
        <span>更新項目</span>
        <strong>基本資料與職務資訊</strong>
      </div>

      <div class="info-row">
        <span>處理結果</span>
        <strong class="status">更新完成</strong>
      </div>
    </section>

    <div class="actions">
      <a class="button primary" id="updatedEmployeeLink" href="employees.html">查看員工資料</a>
      <a class="button secondary" href="employees.html">返回員工管理</a>
    </div>
  </main>
</body>
<script src="../assets/js/api.js?v=20260814-review1"></script>
  <script>
    (async () => { const id = new URLSearchParams(window.location.search).get("id"); if (!id) return; try { const user = await apiRequest(`/employees/${id}/`); document.querySelector("#updatedEmployeeName").textContent = user.display_name || user.username; document.querySelector("#updatedEmployeeNo").textContent = user.employee_no || "—"; document.querySelector("#updatedEmployeeLink").href = `employee-detail.html?id=${id}`; } catch (error) {} })();
  </script>
</html>
