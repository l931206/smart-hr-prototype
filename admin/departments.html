<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部門管理｜智慧人資管理平台</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(1050px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .back {
      color: #4338ca;
      font-weight: 800;
    }

    .add-button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 12px;
      color: white;
      background: #4338ca;
      font-weight: 800;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      color: #718096;
      line-height: 1.7;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 22px;
    }

    .summary-card {
      padding: 20px;
      border: 1px solid #e5ebf2;
      border-radius: 18px;
      background: white;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .summary-card.selected {
      border-color: #4338ca;
      box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.16), 0 12px 30px rgba(67, 56, 202, 0.12);
      transform: translateY(-2px);
    }

    .summary-card span {
      color: #718096;
      font-size: 14px;
    }

    .summary-card strong {
      display: block;
      margin-top: 8px;
      font-size: 27px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      padding: 18px;
      border: 1px solid #e5ebf2;
      border-radius: 18px;
      background: white;
    }

    input,
    select {
      min-height: 42px;
      padding: 0 13px;
      border: 1px solid #d8e2ec;
      border-radius: 11px;
      background: white;
      color: #18212f;
      font: inherit;
      outline: none;
    }

    input {
      flex: 1;
    }

    input:focus,
    select:focus {
      border-color: #4338ca;
      box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.1);
    }

    .department-list {
      display: grid;
      gap: 16px;
      margin-top: 18px;
    }

    .department-card {
      display: block;
      padding: 22px;
      border: 1px solid #e5ebf2;
      border-radius: 20px;
      background: white;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .department-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 34px rgba(15, 23, 42, 0.08);
    }

    .department-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .department-main {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 15px;
      background: #eef2ff;
      font-size: 24px;
    }

    .department-main h2 {
      margin: 0;
      font-size: 20px;
    }

    .department-main p {
      margin: 6px 0 0;
      color: #718096;
      font-size: 13px;
    }

    .status {
      display: inline-flex;
      padding: 6px 11px;
      border-radius: 999px;
      color: #047857;
      background: #d1fae5;
      font-size: 12px;
      font-weight: 800;
    }

    .status.inactive {
      color: #b91c1c;
      background: #fee2e2;
    }

    .department-info {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #edf1f5;
    }

    .info-item span {
      display: block;
      margin-bottom: 6px;
      color: #718096;
      font-size: 13px;
    }

    .info-item strong {
      font-size: 14px;
      line-height: 1.6;
    }

    .view-link {
      display: inline-flex;
      margin-top: 18px;
      color: #4338ca;
      font-weight: 800;
    }

    @media (max-width: 760px) {
      .summary-grid {
        grid-template-columns: 1fr;
      }

      .department-info {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 620px) {
      .topbar,
      .toolbar,
      .department-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .department-info {
        grid-template-columns: 1fr;
      }

      input,
      select,
      .add-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="topbar">
      <a class="back" href="index.html">← 返回管理工作台</a>
      <a class="add-button" href="department-create.html">＋ 新增部門</a>
    </div>

    <header class="header">
      <h1>部門管理</h1>
      <p>查看公司部門、部門主管與員工人數。</p>
    </header>

    <section class="summary-grid">
      <a class="summary-card" data-filter="all" href="?filter=all">
        <span>全部部門</span>
        <strong id="departmentTotalCount">0</strong>
      </a>

      <a class="summary-card" data-filter="managed" href="?filter=managed">
        <span>已設定主管</span>
        <strong id="departmentActiveCount">0</strong>
      </a>

      <a class="summary-card" data-filter="employees" href="?filter=employees">
        <span>在職員工</span>
        <strong id="departmentEmployeeCount">0</strong>
      </a>
    </section>

    <section class="toolbar">
      <input type="search" placeholder="搜尋部門名稱或主管姓名">

      <select>
        <option>全部狀態</option>
        <option>啟用中</option>
        <option>已停用</option>
      </select>
    </section>

    <section class="department-list" id="departmentList">
      <p class="empty-state">資料載入中…</p>
    </section>
</main>
  <script src="../assets/js/api.js?v=20260817-review2"></script>
  <script src="../assets/js/admin-data.js?v=20260817-review2"></script>
</body>
  <script>
    (async () => {
      try {
        const [departmentPayload, employeePayload, leavePayload] = await Promise.all([apiRequest("/departments/"), apiRequest("/employees/"), apiRequest("/leave-requests/")]);
        const departments = Array.isArray(departmentPayload) ? departmentPayload : (departmentPayload.results || []);
        const employees = Array.isArray(employeePayload) ? employeePayload : (employeePayload.results || []);
        const leaves = Array.isArray(leavePayload) ? leavePayload : (leavePayload.results || []);
        const counts = document.querySelectorAll(".summary-grid .summary-card strong");
        if (counts[0]) counts[0].textContent = String(departments.length);
        if (counts[1]) counts[1].textContent = String(departments.filter((department) => employees.some((user) => user.department === department.id && user.role === "manager")).length);
        if (counts[2]) counts[2].textContent = String(employees.filter((user) => user.is_active && user.role === "employee").length);
        document.querySelector("#departmentList").innerHTML = departments.map((department) => { const manager = employees.find((user) => user.department === department.id && user.role === "manager"); const count = employees.filter((user) => user.department === department.id && user.is_active && user.role === "employee").length; const pending = leaves.filter((leave) => leave.status === "pending" && leave.employee_department === department.name).length; return `<a class="department-card" href="department-detail.html?id=${Number(department.id)}"><div class="department-head"><div class="department-main"><div class="icon">▦</div><div><h2>${hrEscapeHtml(department.name)}</h2><p>部門代碼：${hrEscapeHtml(department.code)}</p></div></div><span class="status ${department.is_active ? "" : "inactive"}">${department.is_active ? "啟用中" : "已停用"}</span></div><div class="department-info"><div class="info-item"><span>部門主管</span><strong>${hrEscapeHtml(manager?.display_name || "尚未設定")}</strong></div><div class="info-item"><span>員工人數</span><strong>${count} 人</strong></div><div class="info-item"><span>待審核請假</span><strong>${pending} 件</strong></div></div><span class="view-link">查看與編輯部門 →</span></a>`; }).join("") || "<p>目前沒有部門資料。</p>";
      } catch (error) { document.querySelector("#departmentList").innerHTML = `<p>${hrEscapeHtml(error.message || "無法載入部門資料。")}</p>`; }
    })();
  </script>
</html>
