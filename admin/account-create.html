<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>建立帳號｜智慧人資管理平台</title>

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    font-family:Arial,"Noto Sans TC",sans-serif;
    background:#f4f7fb;
    color:#18212f;
}

a{
    text-decoration:none;
    color:inherit;
}

.page{
    width:min(820px,calc(100% - 28px));
    margin:auto;
    padding:28px 0 48px;
}

.back{
    display:inline-flex;
    margin-bottom:22px;
    color:#4338ca;
    font-weight:800;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin:8px 0 0;
    color:#718096;
}

.form-card{
    margin-top:22px;
    padding:26px;
    background:white;
    border-radius:24px;
    border:1px solid #e5ebf2;
    box-shadow:0 14px 38px rgba(15,23,42,.07);
}

.two-column{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:700;
}

input,
select{
    width:100%;
    min-height:46px;
    padding:0 14px;
    border:1px solid #d8e2ec;
    border-radius:12px;
    font:inherit;
}

.notice{
    margin-top:20px;
    padding:16px;
    background:#eef2ff;
    border-left:4px solid #4338ca;
    border-radius:12px;
    color:#555;
    line-height:1.7;
}

.actions{
    display:flex;
    gap:12px;
    margin-top:24px;
}

.button{
    flex:1;
    min-height:46px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:12px;
    font-weight:800;
}

.primary{
    background:#4338ca;
    color:white;
}

.secondary{
    border:1px solid #d8e2ec;
    background:white;
}

@media(max-width:620px){

.two-column{
grid-template-columns:1fr;
}

.actions{
flex-direction:column;
}

.button{
width:100%;
}

}
</style>

</head>

<body>

<main class="page">

<a class="back" href="accounts.html">
← 返回帳號管理
</a>

<header class="header">
<h1>建立帳號</h1>
<p>建立新的登入帳號並指定角色與對應員工。</p>
</header>

<form class="form-card" id="accountCreateForm">

<div class="two-column">

<div class="form-group">
<label for="displayName">使用者姓名</label>
<input id="displayName" type="text" placeholder="例如 王小明" required>
</div>

<div class="form-group">
<label>登入帳號</label>
<input id="username" type="text" placeholder="例如 employee31" required>
</div>

</div>

<div class="two-column">

<div class="form-group">
<label>電子郵件</label>
<input id="email" type="email" placeholder="employee@example.com" required>
</div>

<div class="form-group">
<label>系統角色</label>
<select id="role" required>
<option value="employee">員工</option>
<option value="manager">主管</option>
<option value="admin">系統管理者</option>
</select>
</div>

</div>

<div class="two-column">

<div class="form-group">
<label>初始密碼</label>
<input id="password" type="password" placeholder="至少 8 個字元" minlength="8" required>
</div>

<div class="form-group">
<label>帳號狀態</label>
<select id="status">
<option value="inactive">停用</option>
<option value="active" selected>啟用</option>
</select>
</div>

</div>

<div class="notice">
建立完成後，系統會寄送啟用通知給使用者，第一次登入時需重新設定密碼。
</div>

<div class="actions">

<button class="button primary" type="submit">
建立帳號
</button>

<a class="button secondary" href="accounts.html">
取消
</a>

</div>

</form>

</main>

<script src="../assets/js/api.js?v=b399a09"></script>
<script>
  document.querySelector("#accountCreateForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const button = form.querySelector("button[type=submit]");
    button.disabled = true;
    try {
      const user = await apiRequest("/employees/", { method: "POST", body: JSON.stringify({
        display_name: document.querySelector("#displayName").value.trim(),
        username: document.querySelector("#username").value.trim(),
        email: document.querySelector("#email").value.trim(),
        role: document.querySelector("#role").value,
        password: document.querySelector("#password").value,
        is_active: document.querySelector("#status").value === "active"
      }) });
      window.location.href = `account-create-success.html?id=${user.id}`;
    } catch (error) {
      alert(error.message || "建立帳號失敗。");
      button.disabled = false;
    }
  });
</script>

</body>
</html>
