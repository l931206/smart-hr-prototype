<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部門建立完成｜智慧人資管理平台</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      text-decoration: none;
    }

    .success-card {
      width: min(580px, 100%);
      padding: 38px 30px;
      border: 1px solid #e5ebf2;
      border-radius: 28px;
      background: white;
      text-align: center;
      box-shadow: 0 20px 52px rgba(15, 23, 42, 0.1);
    }

    .success-icon {
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      color: white;
      background: #4338ca;
      font-size: 38px;
      box-shadow: 0 14px 30px rgba(67, 56, 202, 0.24);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    p {
      margin: 14px auto 0;
      max-width: 450px;
      color: #718096;
      line-height: 1.75;
    }

    .department-info {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #eef2ff;
      text-align: left;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 8px 0;
    }

    .info-row span {
      color: #718096;
      font-size: 14px;
    }

    .info-row strong {
      color: #4338ca;
      text-align: right;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      color: #047857;
      background: #d1fae5;
      font-size: 13px;
      font-weight: 800;
    }

    .notice {
      margin-top: 18px;
      padding: 16px;
      border-left: 4px solid #4338ca;
      border-radius: 12px;
      background: #f8fafc;
      color: #475569;
      line-height: 1.7;
      text-align: left;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 800;
    }

    .primary {
      color: white;
      background: #4338ca;
    }

    .secondary {
      color: #475569;
      background: white;
      border: 1px solid #d8e2ec;
    }

    @media (max-width: 520px) {
      .success-card {
        padding: 32px 20px;
      }

      .info-row {
        flex-direction: column;
        gap: 4px;
      }

      .info-row strong {
        text-align: left;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="success-card">
    <div class="success-icon">✓</div>

    <h1>部門建立完成</h1>

    <p>
      系統已建立新部門，
      並完成主管與部門狀態設定。
    </p>

    <section class="department-info">
      <div class="info-row">
        <span>部門名稱</span>
        <strong id="createdDepartmentName">—</strong>
      </div>

      <div class="info-row">
        <span>部門代碼</span>
        <strong id="createdDepartmentCode">—</strong>
      </div>

      <div class="info-row">
        <span>部門主管</span>
        <strong id="createdDepartmentManager">尚未設定</strong>
      </div>

      <div class="info-row">
        <span>部門狀態</span>
        <strong class="status" id="createdDepartmentStatus">—</strong>
      </div>
    </section>

    <div class="notice">
      接下來可至員工管理，將員工分配至新建立的部門。
    </div>

    <div class="actions">
      <a class="button primary" href="departments.html">返回部門管理</a>
      <a class="button secondary" href="department-create.html">繼續新增部門</a>
    </div>
  </main>
  <script src="../assets/js/api.js?v=b399a09"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) return;
      try {
        const [department, employeePayload] = await Promise.all([
          apiRequest(`/departments/${id}/`),
          apiRequest("/employees/")
        ]);
        const employees = Array.isArray(employeePayload) ? employeePayload : (employeePayload.results || []);
        const manager = employees.find((employee) => employee.department === department.id && employee.role === "manager" && employee.is_active);
        document.querySelector("#createdDepartmentName").textContent = department.name || "—";
        document.querySelector("#createdDepartmentCode").textContent = department.code || "—";
        document.querySelector("#createdDepartmentManager").textContent = manager?.display_name || manager?.username || "尚未設定";
        document.querySelector("#createdDepartmentStatus").textContent = department.is_active ? "啟用中" : "已停用";
      } catch (error) {
        document.querySelector("#createdDepartmentManager").textContent = "資料載入失敗";
      }
    })();
  </script>
</body>
</html>
