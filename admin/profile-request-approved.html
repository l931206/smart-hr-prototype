<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資料修改已核准｜智慧人資管理平台</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      text-decoration: none;
    }

    .success-card {
      width: min(580px, 100%);
      padding: 38px 30px;
      border: 1px solid #e5ebf2;
      border-radius: 28px;
      background: white;
      text-align: center;
      box-shadow: 0 20px 52px rgba(15, 23, 42, 0.1);
    }

    .success-icon {
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      color: white;
      background: #4338ca;
      font-size: 38px;
      box-shadow: 0 14px 30px rgba(67, 56, 202, 0.24);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    p {
      max-width: 450px;
      margin: 14px auto 0;
      color: #718096;
      line-height: 1.75;
    }

    .info {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #eef2ff;
      text-align: left;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 8px 0;
    }

    .row span {
      color: #718096;
      font-size: 14px;
    }

    .row strong {
      color: #4338ca;
      text-align: right;
    }

    .status {
      display: inline-flex;
      padding: 5px 10px;
      border-radius: 999px;
      color: #047857;
      background: #d1fae5;
      font-size: 13px;
      font-weight: 800;
    }

    .notice {
      margin-top: 18px;
      padding: 16px;
      border-left: 4px solid #4338ca;
      border-radius: 12px;
      background: #f8fafc;
      color: #475569;
      line-height: 1.7;
      text-align: left;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 800;
    }

    .primary {
      color: white;
      background: #4338ca;
    }

    .secondary {
      color: #475569;
      background: white;
      border: 1px solid #d8e2ec;
    }

    @media (max-width: 520px) {
      .success-card {
        padding: 32px 20px;
      }

      .row {
        flex-direction: column;
        gap: 4px;
      }

      .row strong {
        text-align: left;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="success-card">
    <div class="success-icon">✓</div>

    <h1>資料修改已核准</h1>

    <p>
      系統已更新—的個人資料，
      並將審核結果傳送至員工通知中心。
    </p>

    <section class="info">
      <div class="row">
        <span>申請人</span>
        <strong>—</strong>
      </div>

      <div class="row">
        <span>申請編號</span>
        <strong>—</strong>
      </div>

      <div class="row">
        <span>更新項目</span>
        <strong>電子郵件、聯絡電話</strong>
      </div>

      <div class="row">
        <span>處理結果</span>
        <strong class="status">已核准</strong>
      </div>
    </section>

    <div class="notice">
      最新資料已同步至員工資料、登入帳號與公司聯絡資訊。
    </div>

    <div class="actions">
      <a class="button primary" href="profile-requests.html">繼續處理申請</a>
      <a class="button secondary" href="employee-detail.html">查看員工資料</a>
    </div>
  </main>
  <script src="../assets/js/api.js?v=20260811-live46"></script>
  <script src="../assets/js/admin-settings-data.js?v=20260811-live46"></script>
</body>
</html>
