<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>停用帳號｜智慧人資管理平台</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .back {
      display: inline-flex;
      margin-bottom: 22px;
      color: #4338ca;
      font-weight: 800;
    }

    .card {
      padding: 28px;
      border: 1px solid #e5ebf2;
      border-radius: 24px;
      background: white;
      box-shadow: 0 14px 38px rgba(15, 23, 42, 0.07);
    }

    .warning {
      display: flex;
      gap: 14px;
      padding: 18px;
      border-left: 5px solid #dc2626;
      border-radius: 14px;
      background: #fef2f2;
    }

    .warning-icon {
      font-size: 30px;
    }

    .warning h1 {
      margin: 0 0 8px;
      color: #991b1b;
      font-size: 26px;
    }

    .warning p {
      margin: 0;
      color: #5f6f82;
      line-height: 1.7;
    }

    .info-box {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #f8fafc;
    }

    .row {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid #e8edf2;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row span {
      color: #718096;
      font-size: 14px;
    }

    .row strong {
      line-height: 1.7;
    }

    .form-group {
      margin-top: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 800;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 13px 14px;
      border: 1px solid #d8e2ec;
      border-radius: 12px;
      color: #18212f;
      font: inherit;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #4338ca;
      box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.1);
    }

    .notice {
      margin-top: 22px;
      padding: 16px 18px;
      border-left: 4px solid #f59e0b;
      border-radius: 12px;
      background: #fffbeb;
      color: #6b5b34;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 26px;
    }

    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 800;
    }

    .danger {
      color: white;
      background: #b91c1c;
    }

    .secondary {
      color: #475569;
      background: white;
      border: 1px solid #d8e2ec;
    }

    @media (max-width: 620px) {
      .card {
        padding: 22px 18px;
      }

      .warning,
      .actions {
        flex-direction: column;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="back" href="account-detail.html">← 返回帳號詳情</a>

    <section class="card">
      <div class="warning">
        <div class="warning-icon">⚠️</div>

        <div>
          <h1>確認停用這個帳號？</h1>
          <p>
            停用後，使用者將立即無法登入系統，
            但員工資料與歷史操作紀錄仍會保留。
          </p>
        </div>
      </div>

      <section class="info-box">
        <div class="row">
          <span>使用者</span>
          <strong id="disableName">—</strong>
        </div>

        <div class="row">
          <span>登入帳號</span>
          <strong id="disableUsername">—</strong>
        </div>

        <div class="row">
          <span>員工編號</span>
          <strong id="disableEmployeeNo">—</strong>
        </div>

        <div class="row">
          <span>系統角色</span>
          <strong id="disableRole">—</strong>
        </div>

        <div class="row">
          <span>目前狀態</span>
          <strong id="disableState">—</strong>
        </div>
      </section>

      <div class="form-group">
        <label for="reason">停用原因</label>
        <textarea
          id="reason"
          placeholder="請說明停用原因，例如：員工離職、帳號異常或暫停使用"
          required
        ></textarea>
      </div>

      <div class="notice">
        停用帳號不等同刪除員工資料。若員工離職，仍應至員工管理完成離職設定。
      </div>

      <div class="actions">
        <a class="button danger" id="confirmDisable" href="#">
          確認停用帳號
        </a>

        <a class="button secondary" id="cancelDisable" href="accounts.html">
          取消
        </a>
      </div>
    </section>
  </main>
  <script src="../assets/js/api.js?v=20260811-live47"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) return;
      const set = (selector, value) => { const element = document.querySelector(selector); if (element) element.textContent = value || "—"; };
      try {
        const user = await apiRequest(`/accounts/${id}/`);
        const name = user.display_name || user.username;
        set("#disableName", name); set("#disableUsername", user.username); set("#disableEmployeeNo", user.employee_no); set("#disableRole", user.role_label); set("#disableState", user.is_active ? "已啟用" : "已停用");
        document.querySelector("#cancelDisable").href = `account-detail.html?id=${id}`;
        document.querySelector("#confirmDisable").addEventListener("click", async (event) => {
          event.preventDefault();
          try { await apiRequest(`/accounts/${id}/`, { method: "PATCH", body: JSON.stringify({ is_active: false }) }); window.location.href = `account-disable-success.html?id=${id}`; }
          catch (error) { alert(error.message || "停用帳號失敗。"); }
        });
      } catch (error) { set("#disableName", `無法載入帳號：${error.message}`); }
    })();
  </script>
</body>
</html>
