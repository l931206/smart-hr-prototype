<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帳號建立完成｜智慧人資管理平台</title>

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:24px;
    font-family:Arial,"Noto Sans TC",sans-serif;
    background:#f4f7fb;
    color:#18212f;
}

a{text-decoration:none;}

.card{
    width:min(580px,100%);
    background:white;
    border:1px solid #e5ebf2;
    border-radius:28px;
    padding:38px 30px;
    text-align:center;
    box-shadow:0 20px 52px rgba(15,23,42,.1);
}

.icon{
    width:84px;
    height:84px;
    margin:auto auto 20px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:#4338ca;
    color:white;
    font-size:38px;
}

h1{
    margin:0;
    font-size:30px;
}

p{
    margin:14px auto 0;
    color:#718096;
    line-height:1.8;
    max-width:430px;
}

.info{
    margin-top:22px;
    padding:18px;
    border-radius:16px;
    background:#eef2ff;
    text-align:left;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:8px 0;
}

.row span{
    color:#718096;
}

.row strong{
    color:#4338ca;
}

.status{
    display:inline-flex;
    padding:5px 10px;
    border-radius:999px;
    background:#fef3c7;
    color:#92400e;
    font-size:13px;
    font-weight:800;
}

.notice{
    margin-top:18px;
    padding:16px;
    border-left:4px solid #4338ca;
    border-radius:12px;
    background:#f8fafc;
    text-align:left;
    color:#555;
    line-height:1.7;
}

.actions{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:28px;
}

.button{
    min-height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 20px;
    border-radius:12px;
    font-weight:800;
}

.primary{
    background:#4338ca;
    color:white;
}

.secondary{
    border:1px solid #d8e2ec;
    background:white;
    color:#555;
}

@media(max-width:520px){

.row{
flex-direction:column;
gap:4px;
}

.actions{
flex-direction:column;
}

.button{
width:100%;
}

}
</style>

</head>

<body>

<main class="card">

<div class="icon">✓</div>

<h1>帳號建立完成</h1>

<p>
新的登入帳號已建立成功，
系統已寄送啟用通知給使用者。
</p>

<section class="info">

<div class="row">
<span>使用者</span>
<strong id="createdAccountName">—</strong>
</div>

<div class="row">
<span>登入帳號</span>
<strong id="createdAccountUsername">—</strong>
</div>

<div class="row">
<span>系統角色</span>
<strong id="createdAccountRole">—</strong>
</div>

<div class="row">
<span>帳號狀態</span>
<strong class="status" id="createdAccountStatus">—</strong>
</div>

</section>

<div class="notice">
使用者完成首次登入並設定密碼後，即可開始使用智慧人資管理平台。
</div>

<div class="actions">

<a class="button primary" href="accounts.html">
返回帳號管理
</a>

<a class="button secondary" href="account-create.html">
繼續建立帳號
</a>

</div>

</main>

<script src="../assets/js/api.js?v=20260811-live45"></script>
<script>
  (async () => {
    const id = new URLSearchParams(window.location.search).get("id");
    if (!id) return;
    try {
      const user = await apiRequest(`/employees/${id}/`);
      document.querySelector("#createdAccountName").textContent = user.display_name || user.username;
      document.querySelector("#createdAccountUsername").textContent = user.username;
      document.querySelector("#createdAccountRole").textContent = user.role_label;
      document.querySelector("#createdAccountStatus").textContent = user.is_active ? "已啟用" : "已停用";
    } catch (error) {
      document.querySelector("#createdAccountName").textContent = "資料載入失敗";
    }
  })();
</script>

</body>
</html>
