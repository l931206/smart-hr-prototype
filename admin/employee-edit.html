<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>編輯員工資料｜智慧人資管理平台</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(820px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .back {
      display: inline-flex;
      margin-bottom: 22px;
      color: #4338ca;
      font-weight: 800;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      color: #718096;
      line-height: 1.7;
    }

    .form-card {
      margin-top: 22px;
      padding: 26px;
      border: 1px solid #e5ebf2;
      border-radius: 24px;
      background: white;
      box-shadow: 0 14px 38px rgba(15, 23, 42, 0.07);
    }

    .section-title {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .section-title:not(:first-child) {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #edf1f5;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      padding: 0 14px;
      border: 1px solid #d8e2ec;
      border-radius: 12px;
      background: white;
      color: #18212f;
      font: inherit;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #4338ca;
      box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.1);
    }

    input[disabled] {
      background: #f3f6f9;
      color: #8290a3;
    }

    .help {
      margin: 7px 0 0;
      color: #8290a3;
      font-size: 13px;
      line-height: 1.6;
    }

    .notice {
      margin-top: 4px;
      padding: 16px 18px;
      border-left: 4px solid #4338ca;
      border-radius: 12px;
      background: #eef2ff;
      color: #475569;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 26px;
    }

    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      color: white;
      background: #4338ca;
    }

    .secondary {
      color: #475569;
      background: white;
      border: 1px solid #d8e2ec;
    }

    @media (max-width: 620px) {
      .form-card {
        padding: 22px 18px;
      }

      .two-column {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="back" href="employee-detail.html">← 返回員工資料</a>

    <header class="header">
      <h1>編輯員工資料</h1>
      <p>更新員工的個人資料、職務資訊與直屬主管。</p>
    </header>

    <form class="form-card" id="employeeEditForm">
      <h2 class="section-title">基本資料</h2>

      <div class="two-column">
        <div class="form-group">
          <label for="employeeNo">員工編號</label>
          <input id="employeeNo" type="text" value="—" disabled>
          <p class="help">員工編號建立後不可修改。</p>
        </div>

        <div class="form-group">
          <label for="name">姓名</label>
          <input id="name" type="text" value="" required>
        </div>
      </div>

      <div class="two-column">
        <div class="form-group">
          <label for="email">電子郵件</label>
          <input id="email" type="email" value="" required>
        </div>

        <div class="form-group">
          <label for="phone">聯絡電話</label>
          <input id="phone" type="tel" value="" required>
        </div>
      </div>

      <h2 class="section-title">職務資訊</h2>

      <div class="two-column">
        <div class="form-group">
          <label for="department">部門</label>
          <select id="department" required>
            <option value="">載入中…</option>
          </select>
        </div>

        <div class="form-group">
          <label for="position">職稱</label>
          <input id="position" type="text" value="" placeholder="請輸入職稱" required>
        </div>
      </div>

      <div class="two-column">
        <div class="form-group">
          <label for="manager">直屬主管</label>
          <select id="manager" required>
            <option value="">載入中…</option>
          </select>
        </div>

        <div class="form-group">
          <label for="hireDate">到職日期</label>
          <input id="hireDate" type="date" value="" required>
        </div>

        <div class="form-group">
          <label for="workStartTime">標準上班時間</label>
          <input id="workStartTime" type="time" value="09:00" required>
        </div>

        <div class="form-group">
          <label for="workEndTime">標準下班時間</label>
          <input id="workEndTime" type="time" value="18:00" required>
        </div>
      </div>

      <div class="form-group">
        <label for="status">在職狀態</label>
        <select id="status" required>
          <option selected>在職</option>
          <option>留職停薪</option>
          <option>已離職</option>
        </select>
      </div>

      <div class="notice">
        修改部門、主管或在職狀態後，系統應同步更新該員工的權限與審核流程。
      </div>

      <div class="actions">
        <button class="button primary" type="submit">儲存變更</button>
        <a class="button secondary" href="employee-detail.html">取消</a>
      </div>
    </form>
  </main>
  <script src="../assets/js/api.js?v=20260817-review2"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) return;
      try {
        const user = await apiRequest(`/employees/${id}/`);
        let departments = [];
        try {
          const departmentPayload = await apiRequest("/departments/");
          departments = Array.isArray(departmentPayload) ? departmentPayload : (departmentPayload.results || []);
        } catch (departmentError) {
          const employeePayload = await apiRequest("/employees/");
          const employees = Array.isArray(employeePayload) ? employeePayload : (employeePayload.results || []);
          const known = new Map();
          employees.forEach((employee) => { if (employee.department && employee.department_name) known.set(employee.department, { id: employee.department, name: employee.department_name }); });
          if (user.department && user.department_name) known.set(user.department, { id: user.department, name: user.department_name });
          departments = [...known.values()];
        }
        if (!departments.length && user.department_name) departments = [{ id: user.department, name: user.department_name }];
        const employeePayload = await apiRequest("/employees/");
        const employees = Array.isArray(employeePayload) ? employeePayload : (employeePayload.results || []);
        const managers = employees.filter((employee) => employee.role === "manager" && employee.is_active && (!user.department || employee.department === user.department));
        document.querySelector("#employeeNo").value = user.employee_no || "—";
        document.querySelector("#name").value = user.display_name || user.username;
        document.querySelector("#position").value = user.job_title || "";
        document.querySelector("#email").value = user.email || "";
        document.querySelector("#phone").value = user.phone || "";
        document.querySelector("#hireDate").value = user.hire_date || "";
        document.querySelector("#workStartTime").value = (user.work_start_time || "09:00").slice(0, 5);
        document.querySelector("#workEndTime").value = (user.work_end_time || "18:00").slice(0, 5);
        document.querySelector("#department").innerHTML = departments.map((department) => `<option value="${Number(department.id)}">${hrEscapeHtml(department.name)}</option>`).join("");
        document.querySelector("#department").value = user.department || "";
        document.querySelector("#manager").innerHTML = `<option value="">無直屬主管</option>${managers.map((manager) => `<option value="${Number(manager.id)}">${hrEscapeHtml(manager.display_name || manager.username)}</option>`).join("")}`;
        document.querySelector("#manager").value = user.manager || "";
        document.querySelector("#status").value = user.is_active ? "在職" : "已離職";
        document.querySelector(".back").href = `employee-detail.html?id=${id}`;
        document.querySelector(".button.secondary").href = `employee-detail.html?id=${id}`;
        document.querySelector("#employeeEditForm").addEventListener("submit", async (event) => {
          event.preventDefault(); const button = event.currentTarget.querySelector("button[type=submit]"); button.disabled = true;
          try { await apiRequest(`/employees/${id}/`, { method: "PATCH", body: JSON.stringify({ display_name: document.querySelector("#name").value.trim(), job_title: document.querySelector("#position").value.trim(), email: document.querySelector("#email").value.trim(), phone: document.querySelector("#phone").value.trim(), department: Number(document.querySelector("#department").value) || null, manager: Number(document.querySelector("#manager").value) || null, hire_date: document.querySelector("#hireDate").value || null, work_start_time: document.querySelector("#workStartTime").value, work_end_time: document.querySelector("#workEndTime").value, is_active: document.querySelector("#status").value === "在職" }) }); window.location.href = `employee-detail.html?id=${id}&notice=${encodeURIComponent("員工資料已更新")}`; }
          catch (error) { alert(error.message || "儲存員工資料失敗。"); button.disabled = false; }
        });
      } catch (error) { alert(error.message || "無法載入員工資料。"); }
    })();
  </script>
</body>
</html>
