<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帳號權限已更新｜智慧人資管理平台</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      text-decoration: none;
    }

    .success-card {
      width: min(580px, 100%);
      padding: 38px 30px;
      border: 1px solid #e5ebf2;
      border-radius: 28px;
      background: white;
      text-align: center;
      box-shadow: 0 20px 52px rgba(15, 23, 42, 0.1);
    }

    .success-icon {
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      color: white;
      background: #4338ca;
      font-size: 38px;
      box-shadow: 0 14px 30px rgba(67, 56, 202, 0.24);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    p {
      max-width: 450px;
      margin: 14px auto 0;
      color: #718096;
      line-height: 1.75;
    }

    .account-info {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #eef2ff;
      text-align: left;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 8px 0;
    }

    .info-row span {
      color: #718096;
      font-size: 14px;
    }

    .info-row strong {
      color: #4338ca;
      text-align: right;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      color: #047857;
      background: #d1fae5;
      font-size: 13px;
      font-weight: 800;
    }

    .status.inactive {
      color: #b91c1c;
      background: #fee2e2;
    }

    .notice {
      margin-top: 18px;
      padding: 16px;
      border-left: 4px solid #4338ca;
      border-radius: 12px;
      background: #f8fafc;
      color: #475569;
      line-height: 1.7;
      text-align: left;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 800;
    }

    .primary {
      color: white;
      background: #4338ca;
    }

    .secondary {
      color: #475569;
      background: white;
      border: 1px solid #d8e2ec;
    }

    @media (max-width: 520px) {
      .success-card {
        padding: 32px 20px;
      }

      .info-row {
        flex-direction: column;
        gap: 4px;
      }

      .info-row strong {
        text-align: left;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="success-card">
    <div class="success-icon">✓</div>

    <h1>帳號權限已更新</h1>

    <p>
      系統已儲存帳號的角色與功能權限，
      新設定將於下次登入時套用。
    </p>

    <section class="account-info">
      <div class="info-row">
        <span>使用者</span>
        <strong id="updatedAccountName">—</strong>
      </div>

      <div class="info-row">
        <span>登入帳號</span>
        <strong id="updatedAccountUsername">—</strong>
      </div>

      <div class="info-row">
        <span>系統角色</span>
        <strong id="updatedAccountRole">—</strong>
      </div>

      <div class="info-row">
        <span>帳號狀態</span>
        <strong class="status" id="updatedAccountStatus">—</strong>
      </div>
    </section>

    <div class="notice">
      若角色改為主管或系統管理者，請再次確認部門、直屬員工與管理範圍是否正確。
    </div>

    <div class="actions">
      <a class="button primary" id="updatedAccountDetail" href="accounts.html">查看帳號詳情</a>
      <a class="button secondary" href="accounts.html">返回帳號管理</a>
    </div>
  </main>
</body>
  <script src="../assets/js/api.js?v=b399a09"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) return;
      try {
        const user = await apiRequest(`/employees/${id}/`);
        document.querySelector("#updatedAccountName").textContent = user.display_name || user.username;
        document.querySelector("#updatedAccountUsername").textContent = user.username;
        document.querySelector("#updatedAccountRole").textContent = user.role_label;
        const status = document.querySelector("#updatedAccountStatus");
        status.textContent = user.is_active ? "已啟用" : "已停用";
        status.classList.toggle("inactive", !user.is_active);
        document.querySelector("#updatedAccountDetail").href = `account-detail.html?id=${id}`;
      } catch (error) { /* 保留儲存成功畫面 */ }
    })();
  </script>
</html>
