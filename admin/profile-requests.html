<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料修改申請｜智慧人資管理平台</title>

<style>
*{box-sizing:border-box;}
body{
    margin:0;
    font-family:Arial,"Noto Sans TC",sans-serif;
    background:#f4f7fb;
    color:#18212f;
}
a{text-decoration:none;color:inherit;}

.page{
    width:min(1050px,calc(100% - 28px));
    margin:auto;
    padding:28px 0 48px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.back{
    color:#4338ca;
    font-weight:800;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin:8px 0 0;
    color:#718096;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-top:22px;
}

.card{
    background:white;
    border:1px solid #e5ebf2;
    border-radius:18px;
    padding:20px;
    box-shadow:0 10px 28px rgba(15,23,42,.05);
}

.card span{
    color:#718096;
    font-size:14px;
}

.card strong{
    display:block;
    margin-top:8px;
    font-size:28px;
}

.request-list{
    display:grid;
    gap:16px;
    margin-top:22px;
}

.request{
    display:block;
    background:white;
    border:1px solid #e5ebf2;
    border-radius:20px;
    padding:22px;
    transition:.2s;
}

.request:hover{
    transform:translateY(-2px);
}

.head{
    display:flex;
    justify-content:space-between;
}

.status{
    padding:6px 11px;
    border-radius:999px;
    background:#fef3c7;
    color:#92400e;
    font-size:12px;
    font-weight:800;
}

.detail{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid #edf1f5;
}

.item span{
    display:block;
    color:#718096;
    font-size:12px;
}

.item strong{
    display:block;
    margin-top:6px;
}

.link{
    display:inline-block;
    margin-top:18px;
    color:#4338ca;
    font-weight:800;
}

@media(max-width:700px){
.summary,
.detail{
grid-template-columns:1fr;
}
.head{
flex-direction:column;
gap:10px;
}
}
</style>
</head>

<body>

<main class="page">

<div class="topbar">
<a class="back" href="index.html">← 返回管理工作台</a>
</div>

<header class="header">
<h1>資料修改申請</h1>

</header>

<strong>1</strong>
</div>

<div class="card">
<span>本月申請</span>
<strong>9</strong>
</div>

</section>

<section class="request-list">

<a class="request" href="profile-request-detail.html">

<div class="head">
<div>
<h2>陳員工</h2>
<p>申請編號：PROFILE-20260730-001</p>
</div>

<span class="status">等待審核</span>
</div>

<div class="detail">

<div class="item">

<strong>電話、Email</strong>
</div>

<div class="item">
<span>申請時間</span>
<strong>2026/07/30</strong>
</div>

<div class="item">
<span>部門</span>
<strong>資訊部</strong>
</div>

<div class="item">
<span>主管</span>
<strong>王主管</strong>
</div>

</div>

<span class="link">
查看申請內容 →
</span>

</a>

<a class="request" href="profile-request-detail.html">

<div class="head">
<div>
<h2>林員工</h2>
<p>申請編號：PROFILE-20260729-002</p>
</div>

</div>

<div class="detail">

<div class="item">
<span>修改項目</span>
<strong>姓名</strong>
</div>

<div class="item">
<span>申請時間</span>
<strong>2026/07/29</strong>
</div>

<strong>資訊部</strong>
</div>

<strong>王主管</strong>

</a>

</section>

</main>

</body>
</html>
