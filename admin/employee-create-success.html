<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>員工建立完成｜智慧人資管理平台</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      text-decoration: none;
    }

    .success-card {
      width: min(580px, 100%);
      padding: 38px 30px;
      border: 1px solid #e5ebf2;
      border-radius: 28px;
      background: white;
      text-align: center;
      box-shadow: 0 20px 52px rgba(15, 23, 42, 0.1);
    }

    .success-icon {
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      color: white;
      background: #4338ca;
      font-size: 38px;
      box-shadow: 0 14px 30px rgba(67, 56, 202, 0.24);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    p {
      margin: 14px auto 0;
      max-width: 450px;
      color: #718096;
      line-height: 1.75;
    }

    .employee-info {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #eef2ff;
      text-align: left;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 8px 0;
    }

    .info-row span {
      color: #718096;
      font-size: 14px;
    }

    .info-row strong {
      color: #4338ca;
      text-align: right;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: #d1fae5;
      color: #047857;
      font-size: 13px;
      font-weight: 800;
    }

    .notice {
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: #f8fafc;
      color: #475569;
      line-height: 1.7;
      text-align: left;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 800;
    }

    .primary {
      color: white;
      background: #4338ca;
    }

    .secondary {
      color: #475569;
      background: white;
      border: 1px solid #d8e2ec;
    }

    @media (max-width: 520px) {
      .success-card {
        padding: 32px 20px;
      }

      .info-row {
        flex-direction: column;
        gap: 4px;
      }

      .info-row strong {
        text-align: left;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="success-card">
    <div class="success-icon">✓</div>

    <h1>員工建立完成</h1>

    <p>
      系統已建立員工資料與登入帳號，
      並寄送帳號啟用通知給新進員工。
    </p>

    <section class="employee-info">
      <div class="info-row">
        <span>員工姓名</span>
        <strong id="createdEmployeeName">—</strong>
      </div>

      <div class="info-row">
        <span>員工編號</span>
        <strong id="createdEmployeeNo">—</strong>
      </div>

      <div class="info-row">
        <span>登入帳號</span>
        <strong id="createdEmployeeUsername">—</strong>
      </div>

      <div class="info-row">
        <span>系統角色</span>
        <strong id="createdEmployeeRole">—</strong>
      </div>

      <div class="info-row">
        <span>帳號狀態</span>
        <strong class="status">等待啟用</strong>
      </div>
    </section>

    <div class="notice">
      員工完成初始密碼設定後，即可登入智慧人資管理平台。
    </div>

    <div class="actions">
      <a class="button primary" href="employees.html">返回員工管理</a>
      <a class="button secondary" href="employee-create.html">繼續新增員工</a>
    </div>
  </main>
</body>
  <script src="../assets/js/api.js?v=20260811-live45"></script>
  <script>
    (async () => { const id = new URLSearchParams(window.location.search).get("id"); if (!id) return; try { const user = await apiRequest(`/employees/${id}/`); document.querySelector("#createdEmployeeName").textContent = user.display_name || user.username; document.querySelector("#createdEmployeeNo").textContent = user.employee_no || "—"; document.querySelector("#createdEmployeeUsername").textContent = user.username; document.querySelector("#createdEmployeeRole").textContent = user.role_label; } catch (error) {} })();
  </script>
</html>
