<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帳號已停用｜智慧人資管理平台</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }

    a {
      text-decoration: none;
    }

    .card {
      width: min(580px, 100%);
      padding: 38px 30px;
      border: 1px solid #e5ebf2;
      border-radius: 28px;
      background: white;
      text-align: center;
      box-shadow: 0 20px 52px rgba(15, 23, 42, 0.1);
    }

    .icon {
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      color: white;
      background: #64748b;
      font-size: 38px;
      box-shadow: 0 14px 30px rgba(100, 116, 139, 0.22);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    p {
      max-width: 450px;
      margin: 14px auto 0;
      color: #718096;
      line-height: 1.75;
    }

    .info {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #f8fafc;
      text-align: left;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 8px 0;
    }

    .row span {
      color: #718096;
      font-size: 14px;
    }

    .row strong {
      color: #475569;
      text-align: right;
    }

    .status {
      display: inline-flex;
      padding: 5px 10px;
      border-radius: 999px;
      color: #b91c1c;
      background: #fee2e2;
      font-size: 13px;
      font-weight: 800;
    }

    .reason {
      margin-top: 18px;
      padding: 16px;
      border-left: 4px solid #64748b;
      border-radius: 12px;
      background: #f8fafc;
      color: #475569;
      line-height: 1.7;
      text-align: left;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 800;
    }

    .primary {
      color: white;
      background: #4338ca;
    }

    .secondary {
      color: #475569;
      background: white;
      border: 1px solid #d8e2ec;
    }

    @media (max-width: 520px) {
      .card {
        padding: 32px 20px;
      }

      .row {
        flex-direction: column;
        gap: 4px;
      }

      .row strong {
        text-align: left;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon">✓</div>

    <h1>帳號已停用</h1>

    <p>
      使用者目前已無法登入智慧人資管理平台，
      但員工資料與歷史操作紀錄仍完整保留。
    </p>

    <section class="info">
      <div class="row">
        <span>使用者</span>
        <strong id="disabledName">—</strong>
      </div>

      <div class="row">
        <span>登入帳號</span>
        <strong id="disabledUsername">—</strong>
      </div>

      <div class="row">
        <span>系統角色</span>
        <strong id="disabledRole">—</strong>
      </div>

      <div class="row">
        <span>帳號狀態</span>
        <strong class="status">已停用</strong>
      </div>
    </section>

    <div class="reason">
      <strong>停用原因：</strong><br>
      帳號暫停使用，等待管理者後續確認。
    </div>

    <div class="actions">
      <a class="button primary" href="accounts.html">返回帳號管理</a>
      <a class="button secondary" id="disabledDetailLink" href="accounts.html">查看帳號詳情</a>
    </div>
  </main>
</body>
  <script src="../assets/js/api.js?v=b399a09"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(window.location.search).get("id");
      if (!id) return;
      try {
        const user = await apiRequest(`/employees/${id}/`);
        document.querySelector("#disabledName").textContent = user.display_name || user.username;
        document.querySelector("#disabledUsername").textContent = user.username;
        document.querySelector("#disabledRole").textContent = user.role_label;
        document.querySelector("#disabledDetailLink").href = `account-detail.html?id=${id}`;
      } catch (error) { /* 保留成功頁狀態 */ }
    })();
  </script>
</html>
