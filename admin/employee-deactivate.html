<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設定員工離職｜智慧人資管理平台</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,"Noto Sans TC",sans-serif;
    background:#f4f7fb;
    color:#18212f;
}

a{text-decoration:none;color:inherit;}

.page{
    width:min(760px,calc(100% - 28px));
    margin:auto;
    padding:28px 0 48px;
}

.back{
    display:inline-flex;
    margin-bottom:22px;
    color:#4338ca;
    font-weight:800;
}

.card{
    background:white;
    border:1px solid #e5ebf2;
    border-radius:24px;
    padding:28px;
    box-shadow:0 14px 38px rgba(15,23,42,.07);
}

.warning{
    display:flex;
    gap:14px;
    padding:18px;
    border-left:5px solid #dc2626;
    border-radius:14px;
    background:#fef2f2;
    margin-bottom:24px;
}

.warning-icon{
    font-size:30px;
}

.warning h2{
    margin:0 0 8px;
    color:#991b1b;
}

.warning p{
    margin:0;
    color:#555;
    line-height:1.7;
}

.row{
    display:grid;
    grid-template-columns:120px 1fr;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid #edf1f5;
}

.row:last-child{
    border-bottom:none;
}

.row span{
    color:#718096;
}

label{
    display:block;
    margin-top:24px;
    margin-bottom:8px;
    font-weight:700;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d8e2ec;
    border-radius:12px;
    font:inherit;
}

textarea{
    resize:vertical;
    min-height:120px;
}

.notice{
    margin-top:22px;
    padding:16px;
    border-left:4px solid #4338ca;
    border-radius:12px;
    background:#eef2ff;
    line-height:1.7;
    color:#555;
}

.actions{
    display:flex;
    gap:12px;
    margin-top:28px;
}

.button{
    flex:1;
    min-height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    font-weight:800;
}

.primary{
    background:#dc2626;
    color:white;
}

.secondary{
    border:1px solid #d8e2ec;
    background:white;
    color:#555;
}

@media(max-width:600px){

.actions{
    flex-direction:column;
}

.row{
    grid-template-columns:1fr;
}
}
</style>

</head>

<body>

<main class="page">

<a class="back" href="employee-detail.html">
← 返回員工資料
</a>

<section class="card">

<div class="warning">

<div class="warning-icon">⚠️</div>

<div>
<h2>確認設定為離職？</h2>

<p>
離職後員工將無法登入系統，
並停止參與請假、主管簽核及其他人資流程。
</p>

</div>

</div>

<div class="row">
<span>姓名</span>
<strong id="deactivateEmployeeName">—</strong>
</div>

<div class="row">
<span>員工編號</span>
<strong id="deactivateEmployeeNo">—</strong>
</div>

<div class="row">
<span>部門</span>
<strong id="deactivateEmployeeDepartment">—</strong>
</div>

<div class="row">
<span>職稱</span>
<strong id="deactivateEmployeeRole">—</strong>
</div>

<div class="row">
<span>目前狀態</span>
<strong id="deactivateEmployeeStatus">—</strong>
</div>

<label>離職日期</label>

<input type="date">

<label>離職原因（選填）</label>

<textarea placeholder="例如：自願離職、退休、試用期未通過..."></textarea>

<div class="notice">

系統將同步：

• 停用登入帳號

• 結束主管關聯

• 保留歷史請假與操作紀錄

• 員工資料改為「已離職」

</div>

<div class="actions">

<a class="button primary" id="confirmEmployeeDeactivate"
href="#">
確認離職
</a>

<a class="button secondary" id="cancelEmployeeDeactivate"
href="employees.html">
取消
</a>

</div>

</section>

</main>

<script src="../assets/js/api.js?v=20260811-live43"></script>
<script>
  (async () => {
    const id = new URLSearchParams(window.location.search).get("id");
    if (!id) return;
    const set = (selector, value) => { const element = document.querySelector(selector); if (element) element.textContent = value || "—"; };
    try {
      const employee = await apiRequest(`/employees/${id}/`);
      const name = employee.display_name || employee.username;
      set("#deactivateEmployeeName", name); set("#deactivateEmployeeNo", employee.employee_no); set("#deactivateEmployeeDepartment", employee.department_name); set("#deactivateEmployeeRole", employee.role_label); set("#deactivateEmployeeStatus", employee.is_active ? "在職" : "已離職");
      document.querySelector("#cancelEmployeeDeactivate").href = `employee-detail.html?id=${id}`;
      document.querySelector("#confirmEmployeeDeactivate").addEventListener("click", async (event) => { event.preventDefault(); try { await apiRequest(`/employees/${id}/`, { method: "PATCH", body: JSON.stringify({ is_active: false }) }); window.location.href = `employee-deactivate-success.html?id=${id}`; } catch (error) { alert(error.message || "設定離職失敗。"); } });
    } catch (error) { set("#deactivateEmployeeName", `無法載入員工：${error.message}`); }
  })();
</script>

</body>
</html>
