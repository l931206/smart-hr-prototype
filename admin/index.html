<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>系統管理工作台｜智慧人資管理平台</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">
  <style>
    .admin-dashboard{width:min(1180px,calc(100% - 32px));padding-bottom:40px}.admin-topbar{margin-bottom:20px}.admin-role{display:inline-flex;padding:6px 11px;border-radius:999px;color:#5b21b6;background:#ede9fe;font-size:12px;font-weight:800}
    .admin-overview{display:grid;grid-template-columns:1fr auto;align-items:center;gap:22px;padding:24px;border:1px solid var(--color-border);border-radius:8px;background:#fff;box-shadow:var(--shadow-small)}.admin-overview h1{margin:0;font-size:clamp(25px,3vw,32px)}.admin-overview p{margin:8px 0 0;color:var(--color-muted)}.admin-overview-label{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;color:#4338ca;background:#eef2ff;font-size:13px;font-weight:800}.admin-overview-label svg{width:20px;height:20px}
    .section-heading{margin:28px 0 14px}.section-heading h2{margin:0;font-size:24px}.section-heading p{margin:7px 0 0;color:var(--color-muted);font-size:14px}.action-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.action-card{min-height:196px;display:flex;flex-direction:column;padding:20px;border:1px solid var(--color-border);border-radius:8px;background:#fff;box-shadow:var(--shadow-small);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.action-card:hover{transform:translateY(-2px);border-color:#a5b4fc;box-shadow:var(--shadow-medium)}.action-card.primary{color:#fff;border-color:#3730a3;background:#3730a3}.admin-action-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;color:#3730a3;background:#eef2ff}.action-card.primary .admin-action-icon{background:#fff}.admin-action-icon svg{width:22px;height:22px}.action-card h2{margin:18px 0 7px;font-size:18px}.action-card p{margin:0;color:var(--color-muted);font-size:14px;line-height:1.6}.action-card.primary p{color:#e0e7ff}.card-link,.badge{margin-top:auto;padding-top:16px;font-size:13px;font-weight:800}.badge{display:block;color:#b45309}.action-card.primary .card-link{color:#fff}
    .summary-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:18px}.panel-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:18px}.panel{padding:22px}.panel h2{margin:0 0 12px;font-size:19px}.task{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #e8edf2}.task:last-child{border-bottom:0}.task h3,.activity h3{margin:0;font-size:14px}.task p,.activity p{margin:5px 0 0;color:var(--color-muted);font-size:12px;line-height:1.5}.task-status{flex:0 0 auto;padding:5px 9px;border-radius:999px;color:#92400e;background:#fef3c7;font-size:11px;font-weight:800}.activity{padding:12px 0;border-bottom:1px solid #e8edf2}.activity:last-child{border-bottom:0}.admin-secondary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.admin-secondary a{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid var(--color-border);border-radius:8px;background:#fff;font-weight:800}
    @media(max-width:1000px){.action-grid,.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel-grid{grid-template-columns:1fr}}
    @media(max-width:700px){.has-admin-sidebar>.admin-dashboard,.admin-dashboard{width:calc(100% - 16px)!important;margin-left:auto!important;margin-right:auto!important;padding-bottom:32px}.admin-role{display:none}.admin-overview{padding:18px 16px}.admin-overview h1{font-size:23px}.admin-overview p{font-size:13px}.admin-overview-label span:last-child{display:none}.section-heading{margin:22px 0 12px}.section-heading h2{font-size:21px}.section-heading p{font-size:12px}.action-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.action-card{min-height:148px;padding:15px}.action-card.primary{grid-column:1/-1;min-height:160px}.action-card h2{margin:12px 0 5px;font-size:16px}.action-card p{display:none}.card-link,.badge{padding-top:12px}.summary-grid{gap:9px}.panel{padding:16px}.task{align-items:flex-start;flex-direction:column;gap:8px}.admin-secondary{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="page admin-dashboard">
    <header class="topbar admin-topbar">
      <div class="brand"><span class="brand-mark">兆</span><div><strong>智慧人資管理平台</strong><small>系統管理工作台</small></div></div>
      <div class="top-actions"><span class="admin-role">系統管理者</span><button class="round-button" type="button" title="登出" aria-label="登出" onclick="logout()"><span data-hr-icon="logout"></span></button></div>
    </header>
    <section class="admin-overview"><div><h1>系統管理工作台</h1><p>管理公司人事資料、組織架構與帳號權限。</p></div><div class="admin-overview-label"><span data-hr-icon="account"></span><span>管理者權限</span></div></section>
    <section class="section-heading"><h2>你要管理什麼？</h2><p>常用管理功能已依日常工作順序排列。</p></section>
    <section class="action-grid">
      <a class="action-card primary" href="employees.html"><div class="admin-action-icon" data-hr-icon="team"></div><h2>員工管理</h2><p>新增、查看及維護員工資料與在職狀態。</p><span class="card-link">管理員工 →</span></a>
      <a class="action-card" href="accounts.html"><div class="admin-action-icon" data-hr-icon="account"></div><h2>帳號與權限</h2><p>建立帳號並設定員工、主管或管理者角色。</p><span class="card-link">管理帳號 →</span></a>
      <a class="action-card" href="departments.html"><div class="admin-action-icon" data-hr-icon="department"></div><h2>部門管理</h2><p>建立組織部門並指定部門主管。</p><span class="card-link">管理部門 →</span></a>
      <a class="action-card" href="profile-requests.html"><div class="admin-action-icon" data-hr-icon="history"></div><h2>資料修改申請</h2><p>審核員工提出的個人資料異動。</p><span class="badge">載入中</span></a>
    </section>
    <section class="summary-grid"><article class="summary-card"><span>在職員工</span><strong>0</strong></article><article class="summary-card"><span>公司部門</span><strong>0</strong></article><article class="summary-card"><span>待處理資料申請</span><strong>0</strong></article><article class="summary-card"><span>啟用帳號</span><strong>0</strong></article></section>
    <section class="panel-grid"><article class="panel"><h2>等待處理</h2><p>資料載入中。</p></article><article class="panel"><h2>近期系統活動</h2><p>資料載入中。</p></article></section>
    <section class="section-heading"><h2>其他系統設定</h2></section>
    <section class="admin-secondary"><a href="leave-settings.html"><span class="admin-action-icon" data-hr-icon="calendar"></span>假別與規則</a><a href="system-log.html"><span class="admin-action-icon" data-hr-icon="history"></span>系統操作紀錄</a></section>
  </main>
  <script src="../assets/js/api.js?v=20260819-manager-admin-ux"></script><script src="../assets/js/dashboard-data.js?v=20260819-manager-admin-ux"></script>
</body>
</html>
