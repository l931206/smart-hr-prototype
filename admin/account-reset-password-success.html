<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密碼重設完成｜智慧人資管理平台</title>

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:24px;
    font-family:Arial,"Noto Sans TC",sans-serif;
    background:#f4f7fb;
    color:#18212f;
}

a{text-decoration:none;}

.card{
    width:min(580px,100%);
    background:white;
    border:1px solid #e5ebf2;
    border-radius:28px;
    padding:38px 30px;
    text-align:center;
    box-shadow:0 20px 52px rgba(15,23,42,.1);
}

.icon{
    width:84px;
    height:84px;
    margin:auto auto 20px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:#4338ca;
    color:white;
    font-size:38px;
}

h1{
    margin:0;
    font-size:30px;
}

p{
    margin:14px auto 0;
    color:#718096;
    line-height:1.8;
    max-width:430px;
}

.info{
    margin-top:22px;
    padding:18px;
    border-radius:16px;
    background:#eef2ff;
    text-align:left;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:8px 0;
}

.row span{
    color:#718096;
}

.row strong{
    color:#4338ca;
}

.status{
    display:inline-flex;
    padding:5px 10px;
    border-radius:999px;
    background:#dcfce7;
    color:#166534;
    font-size:13px;
    font-weight:800;
}

.notice{
    margin-top:18px;
    padding:16px;
    border-left:4px solid #4338ca;
    border-radius:12px;
    background:#f8fafc;
    text-align:left;
    color:#555;
    line-height:1.7;
}

.actions{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:28px;
}

.button{
    min-height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 20px;
    border-radius:12px;
    font-weight:800;
}

.primary{
    background:#4338ca;
    color:white;
}

.secondary{
    border:1px solid #d8e2ec;
    background:white;
    color:#555;
}

@media(max-width:520px){

.row{
flex-direction:column;
gap:4px;
}

.actions{
flex-direction:column;
}

.button{
width:100%;
}

}
</style>

</head>

<body>

<main class="card">

<div class="icon">✓</div>

<h1>密碼已重設</h1>

<p>
使用者原有密碼已失效，
系統已依照設定完成密碼重設流程。
</p>

<section class="info">

<div class="row">
<span>使用者</span>
<strong id="resetSuccessName">—</strong>
</div>

<div class="row">
<span>登入帳號</span>
<strong id="resetSuccessUsername">—</strong>
</div>

<div class="row">
<span>重設方式</span>
<strong>管理員設定新密碼</strong>
</div>

<div class="row">
<span>目前狀態</span>
<strong class="status">已完成</strong>
</div>

</section>

<div class="notice">
使用者收到重設通知後，可依照信件內容重新設定密碼；完成設定後即可再次登入系統。
</div>

<div class="actions">

<a class="button primary" href="accounts.html">
返回帳號管理
</a>

<a class="button secondary" id="resetSuccessDetail" href="accounts.html">
返回帳號詳情
</a>

</div>

</main>

<script src="../assets/js/api.js?v=20260811-live47"></script>
<script>
  (async () => {
    const id = new URLSearchParams(window.location.search).get("id");
    if (!id) return;
    try {
      const user = await apiRequest(`/accounts/${id}/`);
      document.querySelector("#resetSuccessName").textContent = user.display_name || user.username;
      document.querySelector("#resetSuccessUsername").textContent = user.username;
      document.querySelector("#resetSuccessDetail").href = `account-detail.html?id=${id}`;
    } catch (error) { document.querySelector("#resetSuccessName").textContent = "資料載入失敗"; }
  })();
</script>

</body>
</html>
